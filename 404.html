<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rideon에서 열어보세요</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.png">
<style>
:root {
  color-scheme: dark;
  --bg: #0E0F11;
  --fg: #F1F2F3;
  --muted: rgba(255,255,255,0.55);
  --rule: rgba(255,255,255,0.09);
  --accent: #C8F542;
  --card: #17191C;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Roboto, sans-serif;
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

/* 머리글·푸터는 홈과 문서가 **같은 것**을 쓴다 — 약관만 다른 사이트처럼 보이던
   것을 고쳤다 (2026-09-17 지시: "홈탭이랑 아예 분위기가 다르고 이어지지 않네") */
header { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  flex-wrap: wrap; padding: 0.5rem 0 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--rule); }
header .brand img { height: 1.6rem; width: auto; display: block; }
header.bare { justify-content: flex-end; border-bottom: 0; margin-bottom: 0; }
nav { display: flex; gap: 1.1rem; flex-wrap: wrap; font-size: 0.88rem; }
nav a { color: var(--muted); text-decoration: none; }
nav a:hover { color: var(--fg); }
nav a[aria-current="page"] { color: var(--accent); }
h1 { font-size: 1.6rem; line-height: 1.35; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
h2 { font-size: 1.12rem; margin: 2.5rem 0 0.75rem; padding-left: 0.7rem; border-left: 3px solid var(--accent); }
h3 { font-size: 1rem; margin: 1.75rem 0 0.5rem; color: var(--accent); }
p, li { font-size: 0.97rem; color: rgba(255,255,255,0.78); }
ul { padding-left: 1.25rem; }
li { margin: 0.35rem 0; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
code { background: var(--card); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
a { color: var(--accent); }
strong { color: var(--fg); font-weight: 700; }
main { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 1.75rem 1.5rem; }
main > h1:first-child { margin-bottom: 1.25rem; }
footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: 0.85rem; }
footer a { color: var(--muted); text-decoration: none; }
footer a:hover { color: var(--fg); text-decoration: underline; }
.foot-cols { display: grid; gap: 1.5rem; grid-template-columns: 1.4fr repeat(3, 1fr); }
.foot-cols > div { display: flex; flex-direction: column; gap: 0.35rem; }
.foot-cols b { color: var(--fg); font-size: 0.82rem; margin-bottom: 0.2rem; }
.foot-brand img { height: 1.3rem; width: auto; align-self: flex-start; }
.foot-brand p { margin: 0.4rem 0 0; font-size: 0.82rem; color: var(--muted); }
.foot-safe { margin: 1.75rem 0 0.3rem; font-size: 0.8rem; color: var(--muted); }
.foot-copy { margin: 0; font-size: 0.78rem; color: var(--muted); }
@media (max-width: 40rem) { .foot-cols { grid-template-columns: 1fr 1fr; } .foot-brand { grid-column: 1 / -1; } }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
th, td { border: 1px solid var(--rule); padding: 0.5rem 0.65rem; text-align: left; }
th { background: rgba(255,255,255,0.04); color: var(--fg); }
@media (max-width: 30rem) {
  main { padding: 1.25rem 1.1rem; border-radius: 14px; }
  header { padding-bottom: 0.85rem; }
}
</style>
</head>
<body>
  <div class="wrap">
    <main style="text-align:center;padding:48px 0">
      <h1 style="border:0">Rideon 앱에서 열어보세요</h1>
      <p>이 링크는 앱에서 열립니다. 앱이 깔려 있으면 링크를 다시 눌러 주세요.</p>

      <p style="margin-top:28px"><a href="/">Rideon 소개 보기</a></p>
    </main>
  </div>
</body>
</html>
