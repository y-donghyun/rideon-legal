<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-8qFtAr0k7nFDuIRvrr5i9ijsKDnpA1DlzssTs92mhPw=' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js; style-src 'unsafe-inline'; connect-src https://oefeqwkvbnhlkwjpvpwv.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<title>Rideon 운영판</title>
<style>
:root{--bg:#f5f6f3;--fg:#15171a;--mut:#5d646c;--card:#ffffff;--line:#e2e5e0;--acc:#4f7a00;--accbg:#eef7d9;--warn:#a14a00;--warnbg:#fff1dc;--bad:#c42b2b;--badbg:#fde8e8;--bar:#8fbf1f;--bar2:#d9dfd2;--bar3:#c9d3bd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e10;--fg:#eef0f2;--mut:#a0a7af;--card:#17191c;--line:#2a2d31;--acc:#c9f53d;--accbg:#22300a;--warn:#fbbf24;--warnbg:#2e2106;--bad:#ff7070;--badbg:#3a1414;--bar:#c9f53d;--bar2:#33373c;--bar3:#4a4f55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0e10;--fg:#eef0f2;--mut:#a0a7af;--card:#17191c;--line:#2a2d31;--acc:#c9f53d;--accbg:#22300a;--warn:#fbbf24;--warnbg:#2e2106;--bad:#ff7070;--badbg:#3a1414;--bar:#c9f53d;--bar2:#33373c;--bar3:#4a4f55;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;margin:0;padding-block:20px;padding-inline:16px;font-size:14px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:16px}
header h1{font-size:24px;margin:0;letter-spacing:-.02em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header p{margin:4px 0 0;color:var(--mut);font-size:13px}
header .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
h2{font-size:16px;margin:0 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 small,h3 small{color:var(--mut);font-weight:400;font-size:12px}
h3{font-size:14px;margin:16px 0 8px}
.lead{color:var(--mut);font-size:13px;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:14px 12px}
.k b{display:block;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.25}
.k b small{font-size:13px;font-weight:500;color:var(--mut);margin-left:2px}
.k span.l{color:var(--mut);font-size:12px;display:block}
.d{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.d.good{color:var(--acc)} .d.bad{color:var(--bad)} .d.eq{color:var(--mut);font-weight:400}
.today,.settle{border:2px solid var(--acc)}
.settle .say{margin:0 0 12px;padding:12px 14px;border-radius:12px;background:var(--accbg);display:grid;gap:4px;font-size:14px}
.settle td.mutd{color:var(--mut)}
.settle .sum{font-size:15px;margin:0 0 10px;line-height:1.6}
.settle .flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.settle .flow .fl{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.settle .flow b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.3}
.settle .flow .weak .fl{color:var(--warn);font-weight:600}
.settle .flow .weak .fill{background:var(--warn)}
@media (max-width:560px){.settle .flow{gap:4px}.settle .flow b{font-size:15px}}
.settle .new{font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;background:var(--accbg);color:var(--fg);margin-left:4px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.barrow{display:grid;grid-template-columns:110px 1fr 52px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.track{height:10px;background:var(--bar2);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--bar);border-radius:5px}
.barrow.meter{grid-template-columns:150px 1fr 160px}
@media (max-width:560px){.barrow.meter{grid-template-columns:1fr auto}.barrow.meter .track{grid-column:1/-1;grid-row:2}}
.mut{color:var(--mut)}
.small{font-size:12px}
.st{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--accbg);color:var(--fg)}
.st.warn{background:var(--warnbg);color:var(--warn)}
.st.bad{background:var(--badbg);color:var(--bad)}

button{font:inherit;font-size:13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;cursor:pointer;min-height:36px}

code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.gate{max-width:360px;margin:12vh auto 0;display:grid;gap:14px}
.gate h1{font-size:22px;margin:0;letter-spacing:-.02em}

.gate input:focus{outline:2px solid var(--acc);outline-offset:1px}
.err{color:var(--bad);font-size:13px;min-height:1.5em;margin:0}
/* 스토어 리뷰 (0363) — 답 기다리는 리뷰는 노랑 테두리 · 1~2점 빨강 · 3점 노랑 */
.rv{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:grid;gap:4px}

.rv .h{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut)}
.rv .h b{color:var(--fg);font-size:13px}

.rv .reply{border-left:3px solid var(--line);padding-left:8px;color:var(--mut);font-size:13px}
.stars{font-weight:700;letter-spacing:1px;color:var(--acc);white-space:nowrap}
.stars.bad{color:var(--bad)} .stars.warn{color:var(--warn)}
/* 앱 크래시 (0364) — 리뷰 카드(.rv) 모양을 그대로 쓴다 · 새 크래시는 노랑 테두리 · 24시간 3명 이상은 빨강 */
.rv.bad{border-color:var(--bad);background:var(--badbg)}
.rv .sub{color:var(--mut);font-size:12px;overflow-wrap:anywhere}
.crsum{margin:0 0 6px;font-size:13px;font-variant-numeric:tabular-nums}
.crsum b{font-size:15px}
[hidden]{display:none!important}
</style>
</head><body>

<section class="gate" id="login" hidden>
  <h1>Rideon 운영판 <span class="tag dev" id="loginTag"></span></h1>
  <p class="mut" style="margin:0;font-size:13px">운영진 전용입니다.</p>
  <form id="loginForm" autocomplete="on" novalidate>
    <div style="display:grid;gap:12px">
      <label>아이디<input id="loginId" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label>비밀번호<input id="loginPw" name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" id="loginBtn" type="submit">들어가기</button>
      <p class="err" id="loginErr" role="alert"></p>
    </div>
  </form>
</section>

<section class="gate" id="denied" hidden>
  <h1>권한 없음</h1>
  <p class="mut" style="margin:0">이 계정은 운영판을 볼 수 없습니다.</p>
  <button id="deniedOut" type="button">로그아웃</button>
</section>

<div class="wrap" id="app" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js" integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+" crossorigin="anonymous"></script>
<script>
'use strict'
// 빌드가 채운다(tool/ops_web_build.mjs --target dev|prod). anon 키는 앱에도 박혀 있는 공개 키다.
// 서비스 키·관리 토큰·비밀번호는 이 파일에 없다. 운영진 대부분이 개발자가 아니다 — 화면엔 쉬운 말만,
// 기술 상세는 맨 아래 「개발자용 자세히」 한 곳에.
const CFG = {"target":"prod","url":"https://oefeqwkvbnhlkwjpvpwv.supabase.co","anon":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lZmVxd2t2Ym5obGt3anB2cHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NjQ5MDMsImV4cCI6MjEwMzE0MDkwM30.6FsToBVliUCz-bPfGdEpEKEk7MzoeM2nDbdHesd3KfQ"}
const LOGIN_IDS = { admin: 'ops-admin@rideon-app.com' }
const RELOAD_MS = 60000
const STALE_SNAPSHOT_MIN = 15
const isProd = CFG.target === 'prod'

const sb = window.supabase.createClient(CFG.url, CFG.anon, {
  auth: { storageKey: `rideon-ops-${CFG.target}`, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
})

// ── 형식 ───────────────────────────────────────────────────
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const isNum = (n) => n != null && n !== '' && !Number.isNaN(Number(n))
const num = (n, digits = 0) => (!isNum(n) ? '—' : Number(n).toLocaleString('ko-KR', { maximumFractionDigits: digits, minimumFractionDigits: 0 }))
const kst = (d) => Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
  timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
}).formatToParts(new Date(d)).map((p) => [p.type, p.value]))
const kstDate = (d) => { const p = kst(d); return `${p.year}-${p.month}-${p.day}` }
function clock(d) {
  const p = kst(d); const h = Number(p.hour)
  return `${h < 12 ? '오전' : '오후'} ${h % 12 === 0 ? 12 : h % 12}:${p.minute}`
}
function when(d) {
  if (!d) return '—'
  const today = kstDate(new Date()), yest = kstDate(new Date(Date.now() - 86400000)), day = kstDate(d)
  if (day === today) return `오늘 ${clock(d)}`
  if (day === yest) return `어제 ${clock(d)}`
  const p = kst(d)
  return `${Number(p.month)}/${Number(p.day)} ${clock(d)}`
}
const mins = (d) => (d ? (Date.now() - new Date(d).getTime()) / 60000 : null)
/** 오류가 어느 함수에서 · 마지막이 언제였나 — 「send-push 54건 · 마지막 2시간 전」 */
function edgeErrWhere(ee) {
  const top = (ee?.by ?? []).filter((x) => Number(x.e5) > 0).sort((a, b) => b.e5 - a.e5).slice(0, 2)
  const parts = top.map((x) => `${x.slug} ${Number(x.e5).toLocaleString('ko-KR')}건`)
  if (ee?.last5) parts.push(`마지막 ${ago(ee.last5)}`)
  return parts.length ? ` · ${parts.join(' · ')}` : ''
}
function ago(d) {
  const m = mins(d)
  if (m == null) return ''
  if (m < 1) return '방금'
  if (m < 60) return `${Math.round(m)}분 전`
  if (m < 1440) return `${Math.round(m / 60)}시간 전`
  return `${Math.round(m / 1440)}일 전`
}
function bytes(b) {
  const mb = Number(b) / 1048576
  if (!Number.isFinite(mb)) return '—'
  if (Math.abs(mb) >= 1024) return `${(mb / 1024).toFixed(1)} GB`
  if (Math.abs(mb) >= 10) return `${Math.round(mb)} MB`
  if (Math.abs(mb) >= 0.1) return `${mb.toFixed(1)} MB`
  return `${Math.round(Number(b) / 1024)} KB`
}
function won(n) {
  if (n <= 0) return '0원'
  if (n < 10000) return `${num(n)}원`
  return `약 ${num(Math.round(n / 10000))}만 원`
}
const pctOf = (a, b) => (b ? Math.round((a / b) * 100) : null)
const unit = (v, u) => `${v}<small>${u}</small>`

/** 어제 이맘때보다 — bad: 늘면 나쁜 값(빨강) · neutral: 좋고 나쁨이 없는 값(회색) · fmt: 차이를 그리는 법(예: bytes) ·
 *  vs: 무엇과 비교했나(정착 칸은 「그 전 주」) */
function dl(cur, prev, { bad = false, digits = 0, neutral = false, fmt = null, vs = '어제 이맘때' } = {}) {
  if (!isNum(cur) || !isNum(prev)) return ''
  const diff = Number(cur) - Number(prev)
  const r = Math.round(diff * 10 ** digits) / 10 ** digits
  if (r === 0) return `<span class="d eq" title="${esc(vs)}와 같음">–</span>`
  const up = r > 0
  const cls = neutral ? 'eq' : (up !== bad) ? 'good' : 'bad'
  return `<span class="d ${cls}" title="${esc(vs)}보다">${up ? '▲' : '▼'}${fmt ? fmt(Math.abs(r)) : num(Math.abs(r), digits)}</span>`
}
const kpi = (value, label, delta = '') => `<div class="k"><b>${value}</b><span class="l">${esc(label)} ${delta}</span></div>`
const pill = (state, text) => `<span class="st ${state}">${esc(text)}</span>`
const STATE_TEXT = { ok: '정상', warn: '주의', bad: '문제', info: '참고' }

// ── 이름표 ─────────────────────────────────────────────────
const REASONS = {
  reroute: '길 벗어나 다시 찾기', course_link: '코스로 가는 길', start: '길안내 시작', room_nav: '그룹 방 길안내', rally: '집결지 가는 길',
  edit: '경로 고치기', course_voice: '코스 음성 안내', course_line: '안내선 얹기', unknown: '옛 앱(이유 모름)',
}
const REPORT_TYPES = { user: '사용자', post: '글', comment: '댓글', direct_message: '1:1 메시지', group_message: '대화방 메시지', group_ride: '그룹 방', crew: '크루', crew_notice: '크루 공지' }
const REPORT_REASONS = { spam: '스팸·광고', abuse: '욕설·괴롭힘', sexual: '음란', violence: '폭력', fake: '사칭·거짓', other: '기타' }
const BUCKETS = { 'route-thumbnails': '지도 그림', maptiles: '지도 타일', 'post-images': '글 사진', avatars: '프로필 사진', 'dm-images': '메시지 사진', 'group-images': '대화방 사진', 'bike-photos': '바이크 사진', 'crew-emblems': '크루 엠블럼' }
function notifKind(t) {
  t = String(t ?? '')
  if (t.startsWith('group_ride')) return '그룹 라이딩'
  if (t.startsWith('crew')) return '크루'
  if (t.includes('follow')) return '팔로우'
  if (t.includes('comment')) return '댓글'
  if (t.includes('like')) return '좋아요'
  if (t.includes('mention')) return '멘션'
  if (t.includes('group') || t.includes('chat')) return '대화방'
  if (t.includes('official') || t.includes('notice')) return '공지'
  return '그 밖'
}

// ── 상태 ───────────────────────────────────────────────────
let S = {}, A = {}
const sec = (name, src = S) => {
  const r = src[name]
  if (!r) return { ok: false, at: null, error: '아직 집계 없음' }
  return { ok: r.ok, at: r.taken_at, data: r.payload, error: r.payload?.error ?? (r.ok ? null : '실패') }
}
const failBox = (s) => `<p class="st warn" style="display:block;padding:8px 12px;border-radius:10px">이 칸의 숫자를 지금 못 읽었어요 — 개발자에게 알려 주세요.</p>`
const T = () => sec('today').ok ? sec('today').data : null
const tnow = (k) => T()?.now?.[k]
const tprev = (k) => T()?.prev?.[k]
const STALE_RIDING_H = 6
const ridingNow = (u, ref = Date.now()) => (u?.riding ?? []).filter((r) => ref - new Date(r.since).getTime() <= STALE_RIDING_H * 3600000)
/** 24시간 「눈에 띄는」 오류 = 앱 서버 기능 오류(5xx) + 보내지 못한 알림. 기록 저장소 로그 오류는 정상 동작의
 *  권한 거절까지 섞여 수가 크게 흔들려(수만~수십만) 여기 더하지 않는다 — 서버 상태 칸에 참고로만 */
function errors24(mg, pushFail) {
  const ed = mg?.edgeErr && !mg.edgeErr.error ? Number(mg.edgeErr.e5) : null
  if (ed == null && !isNum(pushFail)) return null
  return (ed ?? 0) + (isNum(pushFail) ? Number(pushFail) : 0)
}

// ── 확인할 것 ───────────────────────────────────────────────
function issues(newest) {
  const out = []
  const add = (state, text) => out.push({ state, text })
  const m = mins(newest)
  if (m == null || m > STALE_SNAPSHOT_MIN) add('bad', `운영판 숫자가 ${m == null ? '아직' : `${Math.round(m)}분째`} 새로 안 들어와요 — 개발자에게 알려 주세요`)
  const failed = Object.entries(S).filter(([k, r]) => !r.ok && k !== 'reviews' && k !== 'crashes').map(([k]) => k)
  if (failed.length) add('warn', `일부 칸(${failed.length}개)의 숫자를 못 읽었어요`)
  const open = tnow('reports_open')
  if (Number(open) > 0) {
    const old = sec('reports').ok ? sec('reports').data.oldest_open_at : null
    const late = old && mins(old) > 1440
    add(late ? 'bad' : 'warn', `처리 안 된 신고 ${num(open)}건${late ? ` — 가장 오래된 것이 ${ago(old)}` : ''}`)
  }
  if (Number(tnow('push_fail24')) > 0) add('warn', `최근 24시간 보내지 못한 알림 ${num(tnow('push_fail24'))}건`)
  const mg = sec('mgmt').ok ? sec('mgmt').data : null
  if (Number(mg?.edgeErr?.e5) > 0 && !(mg.edgeErr.last5 && Date.now() - Date.parse(mg.edgeErr.last5) > 3600e3)) add('warn', `앱 서버 기능 오류 ${num(mg.edgeErr.e5)}건(24시간)${edgeErrWhere(mg.edgeErr)}`)
  const down = (mg?.fns ?? []).filter((f) => f.status !== 'ACTIVE')
  if (down.length) add('bad', `멈춘 앱 서버 기능 ${down.length}개`)
  const dir = sec('directions')
  if (dir.ok) { const p = pctOf(Number(dir.data.k.billed_month), DIR_FREE_MONTH); if (p >= 80) add(p >= 100 ? 'bad' : 'warn', `네이버 길찾기 이번 달 무료량의 ${p}% 사용`) }
  const st = sec('status')
  if (st.ok && Number(st.data.thumb.pending) > 20) add('warn', `지도 그림 만들기 대기 ${num(st.data.thumb.pending)}건`)
  for (const r of freshRows()) if (r.state === 'warn' || r.state === 'bad') add(r.state, `${r.name} — ${r.why || STATE_TEXT[r.state]}`)
  const st8 = sec('settle')
  if (!st8.ok || mins(st8.at) > SETTLE_STALE_H * 60) add('warn', `정착 칸 숫자가 ${st8.at ? `${ago(st8.at)} 것이에요` : '아직 없어요'} — 하루 한 번 새벽 4시에 새로 세요`)
  for (const x of crashIssues()) add(x.state, x.text)
  for (const x of reviewIssues()) add(x.state, x.text)
  const hv = healthVerdict()
  if (hv && hv.state !== 'ok') add(hv.state, `서버 여유 — ${hv.signals.filter((x) => x.state !== 'ok').map((x) => x.what).join(', ')}`)
  return out
}

function renderHeader(newest) {
  const list = issues(newest)
  const worst = list.some((x) => x.state === 'bad') ? 'bad' : list.length ? 'warn' : 'ok'
  const verdict = list.length
    ? `<div class="verdict ${worst}" role="status"><b>확인할 것 ${list.length}개</b><ul>${list.map((x) => `<li>${pill(x.state, STATE_TEXT[x.state])} ${esc(x.text)}</li>`).join('')}</ul></div>`
    : '<div class="verdict" role="status"><b>오늘은 문제 없어요</b><span class="small">신고·알림·서버·외부 자료 모두 정상이에요.</span></div>'
  return `<header>
  <h1>Rideon 운영판 <span class="tag ${isProd ? '' : 'dev'}">${isProd ? '실서비스' : '개발 서버'}</span></h1>
  <p>숫자는 서버가 5분마다 새로 세고, 이 화면은 1분마다 다시 읽어요. 마지막으로 센 때: <b id="agoText">${newest ? `${when(newest)} · ${ago(newest)}` : '—'}</b></p>
  <div class="bar"><button id="reloadBtn" type="button">지금 다시 읽기</button><button id="logoutBtn" type="button">로그아웃</button><a class="small" href="#settle" style="color:var(--fg)">주간 보고: 정착 칸 ↓</a><a class="small" href="#crashes" style="color:var(--fg)">앱 크래시 ↓</a><a class="small" href="#reviews" style="color:var(--fg)">스토어 리뷰 ↓</a><span class="mut small" id="readAt"></span></div>
</header>${verdict}`
}

function renderToday() {
  const u = sec('users'), ua = sec('users', A), mg = sec('mgmt'), mga = sec('mgmt', A)
  const rideNow = u.ok ? ridingNow(u.data).length : null
  const ridePrev = ua.ok ? ridingNow(ua.data, new Date(ua.at).getTime()).length : null
  const e24 = errors24(mg.ok ? mg.data : null, tnow('push_fail24'))
  const e24p = mga.ok ? errors24(mga.data, tprev('push_fail24')) : null
  const t = T()
  return `<section class="today"><h2>오늘 한눈에 <small>▲▼ = 어제 이맘때보다</small></h2>
  <p class="lead">오늘(한국 시간 0시부터) 지금까지의 숫자예요.</p>
  <div class="kpis">
    ${kpi(unit(num(tnow('users_today')), '명'), '오늘 가입', dl(tnow('users_today'), tprev('users_today')))}
    ${kpi(unit(num(tnow('rides_today')), '건'), '오늘 주행', dl(tnow('rides_today'), tprev('rides_today')))}
    ${kpi(unit(num(rideNow), '명'), '지금 주행 중', dl(rideNow, ridePrev))}
    ${kpi(unit(num(t?.dau_today), '명'), '오늘 앱 연 사람', isNum(t?.dau_yesterday) && Number(t.dau_yesterday) > 0 ? `<span class="mut small">어제 하루 ${num(t.dau_yesterday)}명</span>` : '')}
    ${kpi(unit(num(tnow('reports_open')), '건'), '처리 안 된 신고', dl(tnow('reports_open'), tprev('reports_open'), { bad: true }))}
    ${kpi(unit(num(e24), '건'), '24시간 오류(서버 기능·알림)', dl(e24, e24p, { bad: true }))}
  </div></section>`
}

// ── 정착 (0356) — 대표가 매주 월요일 이 칸 하나만 본다 ─────────
// 숫자는 서버가 하루 한 번(한국 04:03) 8주 치를 다시 센다. 기준값(골수 4주 중 2주 · 첫 주행 7일 …)은 서버
// _ops_settle_rules() 한 곳에 있고, 아래 설명 글도 그 값(payload.rules)을 읽는다 — 여기서 숫자를 따로 적지 않는다.
const SETTLE_STALE_H = 30
const SETTLE_SHOW = 30
const SETTLE_MIN_N = 5   // 「가장 많이 멈추는 곳」은 앞 단계에 이만큼은 있어야 말한다(한두 명으로 판정하지 않게)
const md = (d) => `${Number(String(d).slice(5, 7))}/${Number(String(d).slice(8, 10))}`
const weekEnd = (ws) => new Date(Date.parse(`${ws}T00:00:00Z`) + 6 * 86400e3).toISOString().slice(0, 10)
const weekLabel = (ws) => `${md(ws)}~${md(weekEnd(ws))}`
const dw = (cur, prev, o = {}) => dl(cur, prev, { ...o, vs: '그 전 주' })
/** 깔때기 다섯 단계 — key 는 서버 payload.weeks[] 의 열 · mature 는 그 단계를 「다 셌나」 */
const STEPS = (R) => [
  { key: 'signups', label: '가입', short: '가입', mature: () => true },
  { key: 'ride1', label: `${R.first_days}일 안에 첫 주행`, short: '첫 주행', mature: (w) => w.m7 },
  { key: 'ride2', label: `${R.second_days}일 안에 두 번째 주행`, short: '두 번째 주행', mature: (w) => w.m28 },
  { key: 'crew', label: '크루 가입', short: '크루', mature: (w) => w.m28 },
  { key: 'group', label: '그룹 라이딩 참가', short: '그룹', mature: (w) => w.m28 },
]

function renderSettle() {
  const s = sec('settle')
  const head = '<h2 id="settle">정착 — 라이더가 자리 잡고 있나 <small>대표 주간 보고 · 주 단위(월~일, 한국 시간) · ▲▼ = 그 전 주보다</small></h2>'
  if (!s.ok) return `<section class="settle">${head}${failBox(s)}</section>`
  const p = s.data, R = p.rules
  const W = (k) => p.weeks.find((w) => w.k === k) ?? {}
  const last = W(1), prev = W(2), cur = W(0)
  const steps = STEPS(R)

  // 깔때기 — 가입하고 마지막 단계까지 다 센 주(가입 주가 끝나고 R.second_days 일 지남)만 더한다. 덜 센 주를 섞으면 낮게 나온다
  const ripe = p.weeks.filter((w) => !w.partial && w.m28 && w.signups > 0)
  const tot = Object.fromEntries(steps.map((st) => [st.key, ripe.reduce((a, w) => a + Number(w[st.key]), 0)]))
  let weakest = null
  const funnelRows = steps.map((st, i) => {
    const n = tot[st.key], pAll = pctOf(n, tot.signups)
    const pStep = i === 0 ? null : pctOf(n, tot[steps[i - 1].key])
    if (i > 0 && pStep != null && tot[steps[i - 1].key] >= SETTLE_MIN_N && (!weakest || pStep < weakest.p)) weakest = { i, from: steps[i - 1].label, to: st.label, p: pStep }
    return `<div class="barrow meter"><span>${esc(st.label)}${i > 0 && pStep != null ? `<div class="mut small">앞 단계에서 ${pStep}% 넘어감</div>` : ''}</span>
      <div class="track"><div class="fill" style="width:${pAll == null ? 0 : Math.max(pAll, n > 0 ? 1 : 0)}%"></div></div>
      <span class="n"><b>${pAll == null ? '—' : `${pAll}%`}</b> <span class="mut">${num(n)}명</span></span></div>`
  }).join('')
  const ripeText = ripe.length
    ? `${md(ripe[ripe.length - 1].w)} ~ ${md(weekEnd(ripe[0].w))} 사이 가입한 ${num(tot.signups)}명 (가입한 지 ${R.second_days}일 넘은 사람만 — 그래야 끝까지 센 숫자예요)`
    : ''

  // 한 줄씩 — 대표가 이것만 읽어도 되게
  const newCore = p.core.list.filter((x) => x.new).length
  const say = []
  const coreDiff = Number(last.core) - Number(prev.core)
  say.push(`지난주(${weekLabel(last.w)}) 골수 라이더는 <b>${num(last.core)}명</b>이에요 — ${coreDiff > 0 ? `그 전 주보다 ${num(coreDiff)}명 늘었어요` : coreDiff < 0 ? `그 전 주보다 ${num(-coreDiff)}명 줄었어요` : '그 전 주와 같아요'}.${newCore || p.core.lost.length ? ` (새로 ${num(newCore)}명 · 빠진 사람 ${num(p.core.lost.length)}명)` : ''}`)
  say.push(Number(last.rooms)
    ? `그룹 라이딩은 <b>${num(last.rooms)}번</b>, <b>${num(last.riders)}명</b>이 같이 달렸어요${Number(last.off_rooms) ? ` — 그중 공식 번개 ${num(last.off_rooms)}번 · ${num(last.off_riders)}명` : ' — 공식 번개는 없었어요'}.`
    : '지난주 그룹 라이딩은 없었어요.')
  if (Number(p.nudge.n) > 0) say.push(`최근 ${R.nudge_days}일 안에 가입했는데 아직 한 번도 안 달린 사람이 <b>${num(p.nudge.n)}명</b>이에요 — 첫 주행을 권해 보세요.`)
  if (weakest) say.push(`가장 많이 멈추는 곳 — 「${esc(weakest.from)} → ${esc(weakest.to)}」에서 ${weakest.p}%만 다음 단계로 넘어가요.`)

  // 가입한 주별 — 덜 센 칸은 흐리게(아직 오를 수 있다)
  const cohortRows = p.weeks.map((w) => `<tr><td>${w.partial ? `이번 주 <span class="mut small">진행 중</span>` : weekLabel(w.w)}</td>${steps.map((st, i) => {
    if (i === 0) return `<td class="n">${num(w.signups)}명</td>`
    if (!Number(w.signups)) return '<td class="n mutd">—</td>'
    const pc = pctOf(Number(w[st.key]), Number(w.signups))
    const ripeCell = st.mature(w)
    return `<td class="n${ripeCell ? '' : ' mutd'}" title="${ripeCell ? '' : '아직 세는 중 — 더 오를 수 있어요'}">${pc}%<div class="small mut">${num(w[st.key])}명${ripeCell ? '' : ' · 세는 중'}</div></td>`
  }).join('')}</tr>`).join('')

  // 주별 흐름 — 다 끝난 주는 그 전 주와 ▲▼ · 이번 주는 지금까지
  const trendRows = p.weeks.map((w) => {
    const older = W(w.k + 1)
    const d = (key, o) => (w.partial || older.w == null ? '' : dw(w[key], older[key], o))
    return `<tr><td>${w.partial ? `이번 주 <span class="mut small">지금까지</span>` : weekLabel(w.w)}</td>
      <td class="n">${num(w.core)}명 ${d('core')}</td>
      <td class="n">${num(w.rooms)}번 ${d('rooms')}</td>
      <td class="n">${num(w.riders)}명 ${d('riders')}</td>
      <td class="n">${Number(w.off_rooms) ? `${num(w.off_rooms)}번 · ${num(w.off_riders)}명` : '<span class="mut">—</span>'}</td></tr>`
  }).join('')

  const coreRow = (x) => `<tr><td>${x.nickname ? esc(x.nickname) : '<span class="mut">닉네임 없음</span>'}${x.new ? '<span class="new">새로</span>' : ''}</td><td>${when(x.last)} <span class="mut small">${ago(x.last)}</span></td><td class="n">${num(x.rides)}번</td><td class="n">${num(x.weeks)}/${R.core_window}주</td></tr>`
  const coreHead = `<tr><th>닉네임</th><th>최근 주행</th><th class="n">총 주행</th><th class="n">달린 주</th></tr>`
  const list = p.core.list, shown = list.slice(0, SETTLE_SHOW), rest = list.slice(SETTLE_SHOW)
  const lost = p.core.lost
  const nudge = p.nudge
  const days = (d) => Math.max(0, Math.floor((new Date(p.at) - new Date(d)) / 86400e3))

  // 기본으로 보이는 것은 한 줄 요약 + 흐름 막대 하나(2026-10-27 「이 부분을 좀 줄이든」) — 나머지는 「자세히」로 접는다.
  // 숫자는 위에서 센 것(last·prev·tot·weakest)을 그대로 다시 쓴다
  const sumLine = `<p class="sum">지난주(${weekLabel(last.w)}) 가입 <b>${num(last.signups)}명</b> ${dw(last.signups, prev.signups)} · 골수 <b>${num(last.core)}명</b> ${dw(last.core, prev.core)} · 그룹 라이딩 <b>${num(last.rooms)}번 · ${num(last.riders)}명</b> ${dw(last.riders, prev.riders)}${Number(nudge.n) ? ` · 첫 주행 기다리는 사람 <b>${num(nudge.n)}명</b>` : ''}</p>`
  const flow = ripe.length
    ? `<div class="flow" role="img" aria-label="가입부터 그룹 라이딩까지 — 가입한 사람 중 몇 %">${steps.map((st, i) => {
      const n = tot[st.key], pAll = pctOf(n, tot.signups), weak = weakest?.i === i
      return `<div${weak ? ' class="weak"' : ''} title="${esc(st.label)} ${num(n)}명${weak ? ` · 앞 단계에서 ${weakest.p}%만 넘어옴` : ''}"><div class="fl">${esc(st.short)}</div><b>${pAll == null ? '—' : `${pAll}%`}</b><div class="track"><div class="fill" style="width:${pAll == null ? 0 : Math.max(pAll, n > 0 ? 1 : 0)}%"></div></div></div>`
    }).join('')}</div>
  <p class="mut small" style="margin:6px 0 0">끝까지 센 가입 ${num(tot.signups)}명 중 몇 %${weakest ? ` · 가장 많이 멈추는 곳 「${esc(weakest.from)} → ${esc(weakest.to)}」 ${weakest.p}%` : ''}</p>`
    : `<p class="mut small" style="margin:0">아직 끝까지 센 주가 없어요 — 가입한 지 ${R.second_days}일이 지나야 마지막 단계까지 셀 수 있어요.</p>`
  // 1분마다 다시 그려도 펼친 「자세히」가 닫히지 않게
  const moreOpen = document.getElementById('settleMore')?.open ? ' open' : ''

  return `<section class="settle">${head}
  ${sumLine}
  ${flow}
  <details id="settleMore" style="margin-top:12px"${moreOpen}><summary class="small" style="cursor:pointer;font-weight:600">자세히 — 지난주 숫자 · 단계별 · 가입한 주별 · 주별 흐름 · 골수 라이더 ${num(list.length)}명</summary>
  <p class="lead" style="margin-top:10px">광고보다 먼저 볼 숫자예요. 가입한 사람이 달리고, 다시 달리고, 크루와 그룹 라이딩까지 이어지는지 봐요. 운영진·공식·시험 계정은 빼고 세요.</p>
  <div class="say" role="status">${say.map((x) => `<div>${x}</div>`).join('')}</div>
  <div class="kpis">
    ${kpi(unit(num(last.core), '명'), '골수 라이더(지난주)', dw(last.core, prev.core))}
    ${kpi(unit(num(last.rooms), '번'), '그룹 라이딩(지난주)', dw(last.rooms, prev.rooms))}
    ${kpi(unit(num(last.riders), '명'), '그룹 라이딩 참가(지난주)', dw(last.riders, prev.riders))}
    ${kpi(`${num(last.off_rooms)}<small>번</small> ${num(last.off_riders)}<small>명</small>`, '공식 번개(지난주)', dw(last.off_rooms, prev.off_rooms, { neutral: true }))}
    ${kpi(unit(num(last.signups), '명'), '가입(지난주)', dw(last.signups, prev.signups))}
    ${kpi(unit(num(nudge.n), '명'), `첫 주행 기다리는 사람(최근 ${R.nudge_days}일 가입)`, dl(nudge.n, nudge.prev, { bad: true, vs: '7일 전' }))}
  </div>
  <p class="mut small" style="margin:8px 0 0">이번 주(진행 중) 지금까지: 골수 ${num(cur.core)}명 · 그룹 라이딩 ${num(cur.rooms)}번 · ${num(cur.riders)}명 · 가입 ${num(cur.signups)}명</p>

  <h3>가입부터 그룹 라이딩까지 <small>단계를 차례로 넘은 사람 · 가입한 사람 중 몇 %</small></h3>
  ${ripe.length ? `${funnelRows}<p class="mut small" style="margin:4px 0 0">${ripeText}</p>` : `<p class="mut small">아직 끝까지 센 주가 없어요 — 가입한 지 ${R.second_days}일이 지나야 마지막 단계까지 셀 수 있어요.</p>`}

  <h3>가입한 주별 <small>흐린 칸 = 아직 세는 중(${R.first_days}일·${R.second_days}일이 안 지나 더 오를 수 있어요)</small></h3>
  <div class="tw"><table><tr><th>가입한 주</th>${steps.map((st) => `<th class="n">${esc(st.label)}</th>`).join('')}</tr>${cohortRows}</table></div>

  <h3>주별 흐름 <small>골수 · 그룹 라이딩 · 공식 번개</small></h3>
  <div class="tw"><table><tr><th>주</th><th class="n">골수</th><th class="n">그룹 라이딩</th><th class="n">참가</th><th class="n">공식 번개</th></tr>${trendRows}</table></div>

  <h3>골수 라이더 ${num(list.length)}명 <small>지난주(${weekLabel(last.w)})까지 ${R.core_window}주 중 ${R.core_min}주 이상 달린 사람 · 최근 주행 순</small></h3>
  ${list.length ? `<div class="tw"><table>${coreHead}${shown.map(coreRow).join('')}</table></div>
  ${rest.length ? `<details style="margin-top:8px"><summary class="small" style="cursor:pointer">나머지 ${rest.length}명 더 보기</summary><div class="tw"><table>${coreHead}${rest.map(coreRow).join('')}</table></div></details>` : ''}` : '<p class="mut small">아직 골수 라이더가 없어요.</p>'}

  <details style="margin-top:12px"${lost.length ? '' : ' hidden'}><summary class="small" style="cursor:pointer;font-weight:600">지난주에 골수에서 빠진 사람 ${num(lost.length)}명 — 다시 달리게 말 걸어 볼 사람</summary>
  <div class="tw"><table><tr><th>닉네임</th><th>마지막 주행</th><th class="n">총 주행</th></tr>${lost.map((x) => `<tr><td>${x.nickname ? esc(x.nickname) : '<span class="mut">닉네임 없음</span>'}</td><td>${when(x.last)} <span class="mut small">${ago(x.last)}</span></td><td class="n">${num(x.rides)}번</td></tr>`).join('')}</table></div></details>

// ── 추이 그래프(SVG · 외부 라이브러리 없음) ──────────────────
function miniChart(days, key, label, u) {
  const vals = days.map((d) => (d[key] == null ? null : Number(d[key])))
  const known = vals.filter((v) => v != null)
  const max = Math.max(1, ...known)
  const W = 280, H = 96, top = 14, bottom = 16, gap = 3
  const bw = (W - gap * (days.length - 1)) / days.length
  const bars = vals.map((v, i) => {
    const x = i * (bw + gap)
    if (v == null) return `<rect x="${x.toFixed(1)}" y="${H - bottom - 2}" width="${bw.toFixed(1)}" height="2" fill="var(--bar2)"></rect>`
    const h = Math.max(v > 0 ? 2 : 0, ((H - top - bottom) * v) / max)
    const today = i === days.length - 1
    return `<rect x="${x.toFixed(1)}" y="${(H - bottom - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${today ? 'var(--bar3)' : 'var(--bar)'}"><title>${esc(days[i].d.slice(5).replace('-', '/'))} ${num(v)}${u}${today ? ' (오늘 진행 중)' : ''}</title></rect>`
  }).join('')
  const md = (s) => `${Number(s.slice(5, 7))}/${Number(s.slice(8, 10))}`
  const sum = known.reduce((a, b) => a + b, 0)
  const todayV = vals[vals.length - 1]
  const missing = vals.some((v) => v == null)
  return `<div class="chart" role="img" aria-label="${esc(label)} 최근 14일">
    <div class="t"><b>${esc(label)}</b><span class="mut">14일 ${num(sum, key === 'km' ? 1 : 0)}${u} · 오늘 ${num(todayV, key === 'km' ? 1 : 0)}${u}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="0" y1="${H - bottom}" x2="${W}" y2="${H - bottom}" stroke="var(--line)"></line>
      <text x="0" y="10" font-size="10" fill="var(--mut)">최고 ${num(max)}${u}</text>
      ${bars}
      <text x="0" y="${H - 3}" font-size="10" fill="var(--mut)">${md(days[0].d)}</text>
      <text x="${W / 2}" y="${H - 3}" font-size="10" fill="var(--mut)" text-anchor="middle">${md(days[Math.floor(days.length / 2)].d)}</text>
      <text x="${W}" y="${H - 3}" font-size="10" fill="var(--mut)" text-anchor="end">오늘</text>
    </svg>
    ${missing ? '<div class="mut small">회색 줄 = 그날은 아직 세지 않았어요(운영판을 연 날부터 셉니다)</div>' : ''}
  </div>`
}

/** 크루 목록 — 해산 안 한 크루 전부 · 7일 대화 많은 순 · 20개 넘으면 접기 (0336). 비공개 크루도 운영자에겐 이름·크루장까지 */
// ── 스토어 리뷰 (0363) — 맥이 1시간마다 모은다(tool/ops_reviews_collect.mjs) ─────
// 스토어 열쇠는 서버에 없다(2026-10-27 사용자 결정) — 그래서 맥이 꺼지면 수집이 멈춘다. 3시간 넘게 안 들어오면 노랑.
const REVIEWS_STALE_H = 3
const REVIEWS_SHOW = 8
const STORES = [['play', 'Google Play'], ['app_store', 'App Store']]
const revAt = (s) => s.data?.collected_at ?? s.at
const revWaiting = (p) => STORES.reduce((a, [k]) => a + (p?.[k]?.reviews ?? []).filter((x) => !x.reply).length, 0)
function reviewIssues() {
  const out = []
  if (!S.reviews) return [{ state: 'warn', text: '스토어 리뷰가 아직 한 번도 안 모였어요 — 개발자에게 알려 주세요' }]
  const s = sec('reviews')
  const w = revWaiting(s.data)
  if (w > 0) out.push({ state: 'warn', text: `답 안 단 스토어 리뷰 ${w}건` })
  if (mins(revAt(s)) > REVIEWS_STALE_H * 60) out.push({ state: 'warn', text: `스토어 리뷰 수집이 ${ago(revAt(s))}에 멈췄어요 — 수집하는 맥이 꺼졌거나 잠들었을 수 있어요` })
  const bad = STORES.filter(([k]) => s.data?.[k]?.error).map(([, n]) => n)
  if (bad.length) out.push({ state: 'warn', text: `스토어 리뷰를 못 읽었어요(${bad.join(' · ')}) — 개발자에게 알려 주세요` })
  return out
}
function reviewCard(r) {
  const n = Math.max(0, Math.min(5, Number(r.star) || 0))
  const tone = n <= 2 ? 'bad' : n === 3 ? 'warn' : ''
  const where = [r.version ? `버전 ${r.version}` : '', r.lang ?? r.territory ?? ''].filter(Boolean).join(' · ')
  return `<div class="rv${r.reply ? '' : ' wait'}">
    <div class="h"><span class="stars ${tone}" aria-label="별 ${n}개">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span><b>${esc(r.author ?? '이름 없음')}</b><span>${when(r.at)}</span>${where ? `<span>${esc(where)}</span>` : ''}${r.reply ? pill('ok', '답함') : pill('warn', '답 기다림')}</div>
    ${r.title ? `<p><b>${esc(r.title)}</b></p>` : ''}${r.text ? `<p>${esc(r.text)}</p>` : ''}
    ${r.text_ko ? `<p class="tr">번역: ${esc(r.text_ko)}</p>` : ''}
    ${r.reply ? `<p class="reply">우리 답글 · ${when(r.reply.at)}${r.reply.state && r.reply.state !== 'PUBLISHED' ? ' (게시 대기)' : ''}<br>${esc(r.reply.text ?? '')}</p>` : ''}
  </div>`
}
function renderReviews() {
  const head = '<h2 id="reviews">스토어 리뷰 <small>글 있는 리뷰만 · 맥에서 1시간마다 수집</small></h2>'
  if (!S.reviews) return `<section>${head}<p class="lead">아직 한 번도 안 모였어요 — 수집하는 맥을 확인해 주세요(개발자에게 알려 주세요).</p></section>`
  const s = sec('reviews'), p = s.data ?? {}
  const at = revAt(s), stale = mins(at) > REVIEWS_STALE_H * 60
  const w = revWaiting(p)
  const all = STORES.flatMap(([k]) => p[k]?.reviews ?? [])
  const low = all.filter((x) => Number(x.star) <= 3).length
  const store = ([k, name]) => {
    const st = p[k] ?? { reviews: [] }

// ── 앱 크래시 (0364) — 맥이 1시간마다 Crashlytics 를 읽는다(tool/ops_crashes_collect.mjs) ─────
// 열쇠(보기 전용 서비스 계정)는 서버에 없다(2026-10-27 사용자 결정) — 맥이 꺼지면 수집이 멈춘다. 3시간 넘게 안 들어오면 노랑.
// 「크래시」 = 앱이 죽은 것(치명 FATAL + ANR). 비치명(NON_FATAL)은 앱이 살아 있는 오류·우리가 일부러 남기는 진단이라 따로 센다.
const CRASHES_STALE_H = 3
const CRASH_USERS_BAD = 3      // 한 크래시가 24시간에 이만큼 이상 사람에게 → 빨강
const CRASH_SURGE_MIN = 5      // 24시간 크래시가 이만큼 이상이고
const CRASH_SURGE_X = 2        //   그 전 6일 하루 평균의 이 배 이상 → 빨강(급증)
const PLATS = [['android', 'Android'], ['ios', 'iPhone']]
const CRASH_TYPES = ['FATAL', 'ANR']
const isCrash = (i) => CRASH_TYPES.includes(i.type)
const crAt = (s) => s.data?.collected_at ?? s.at
const isNewIssue = (i) => !!i.first_seen_at && mins(i.first_seen_at) <= 1440
const SIGNALS = { fresh: '최근 처음 나타남', regressed: '고쳤다가 다시 남', repetitive: '한 사람에게 되풀이', early: '켜자마자' }
const TYPE_PILL = { FATAL: ['bad', '크래시'], ANR: ['bad', '응답 없음(ANR)'], NON_FATAL: ['info', '비치명'] }
function crashSurge(p) {
  const d1 = Number(p?.d1?.crash_events), d7 = Number(p?.d7?.crash_events)
  if (!isNum(d1) || !isNum(d7) || d1 < CRASH_SURGE_MIN) return null
  const base = Math.max(0, d7 - d1) / 6
  return d1 >= CRASH_SURGE_X * base ? { d1, base } : null
}
function crashIssues() {
  const out = []
  if (!S.crashes) return [{ state: 'warn', text: '앱 크래시가 아직 한 번도 안 모였어요 — 개발자에게 알려 주세요' }]
  const s = sec('crashes'), p = s.data ?? {}
  for (const [k, name] of PLATS) {
    const st = p[k]
    if (!st) continue
    if (st.error) out.push({ state: 'warn', text: `앱 크래시를 못 읽었어요(${name}) — 개발자에게 알려 주세요` })
    const list = st.issues ?? []
    for (const i of list.filter((x) => isCrash(x) && Number(x.users_24h) >= CRASH_USERS_BAD)) {
      out.push({ state: 'bad', text: `${name} 크래시 하나가 24시간에 ${num(i.users_24h)}명에게 났어요 — ${i.title ?? '제목 없음'}` })
    }
    const fresh = list.filter((x) => isCrash(x) && isNewIssue(x))
    if (fresh.length) out.push({ state: 'warn', text: `${name} 새 크래시 ${fresh.length}개(24시간 안에 처음) — ${fresh.map((x) => x.title ?? '제목 없음').join(' · ')}` })
    const sg = crashSurge(st)
    if (sg) out.push({ state: 'bad', text: `${name} 크래시가 늘었어요 — 24시간 ${num(sg.d1)}건(그 전 6일은 하루 ${num(sg.base, 1)}건)` })
  }
  if (mins(crAt(s)) > CRASHES_STALE_H * 60) out.push({ state: 'warn', text: `앱 크래시 수집이 ${ago(crAt(s))}에 멈췄어요 — 수집하는 맥이 꺼졌거나 잠들었을 수 있어요` })
  return out
}
function crashCard(i) {
  const tone = isCrash(i) && Number(i.users_24h) >= CRASH_USERS_BAD ? ' bad' : isCrash(i) && isNewIssue(i) ? ' wait' : ''
  const [tp, tt] = TYPE_PILL[i.type] ?? ['info', i.type ?? '?']
  const ver = i.first_version || i.last_version ? `버전 ${esc(i.first_version ?? '?')}${i.last_version && i.last_version !== i.first_version ? ` → ${esc(i.last_version)}` : ''}` : ''
  const first = i.first_seen_at ? (i.first_seen_by === 'crashlytics' ? `처음 약 ${ago(i.first_seen_at)}` : `처음 ${when(i.first_seen_at)}`) : '처음: 수집 전부터'
  const sig = (i.signals ?? []).map((x) => SIGNALS[x]).filter(Boolean)
  return `<div class="rv${tone}">
    <div class="h">${pill(tp, tt)}${isNewIssue(i) ? pill('warn', '새 이슈') : ''}<span>7일 <b>${num(i.events_7d)}</b>건 · ${num(i.users_7d)}명</span><span>24시간 ${num(i.events_24h)}건 · ${num(i.users_24h)}명</span>${ver ? `<span>${ver}</span>` : ''}</div>
    <p><b>${esc(i.title ?? '제목 없음')}</b></p>
    ${i.subtitle ? `<p class="sub">${esc(i.subtitle)}</p>` : ''}
    <div class="h"><span>${esc(first)}</span><span>마지막 ${i.last_at ? `${when(i.last_at)}${i.last_event_version ? ` (${esc(i.last_event_version)})` : ''}` : '—'}</span>${sig.length ? `<span>${esc(sig.join(' · '))}</span>` : ''}${String(i.uri ?? '').startsWith('https://console.firebase.google.com/') ? `<a href="${esc(i.uri)}" target="_blank" rel="noopener noreferrer" style="color:var(--fg)">Crashlytics에서 보기</a>` : ''}</div>
  </div>`
}
function renderCrashes() {
  const head = '<h2 id="crashes">앱 크래시 <small>Firebase Crashlytics · 실서비스 앱 · 맥에서 1시간마다 수집</small></h2>'

const DIR_UNIT_WON = 5
const DIR_FREE_MONTH = 60000
const OPINET_DAILY_CAP = 300
function renderDirections() {
  const s = sec('directions')

  const { k, reasons } = s.data

  const ratio = rides7 > 0 ? Math.round((b7 / rides7) * 10) / 10 : null
  const p = pctOf(month, DIR_FREE_MONTH)
  const state = p >= 100 ? 'bad' : p >= 80 ? 'warn' : 'ok'
  const max = Math.max(1, ...reasons.map((r) => Number(r.billed)))
  const bars = reasons.filter((r) => Number(r.billed) > 0).map((r) =>
    `<div class="barrow"><span>${esc(REASONS[r.reason] ?? '그 밖')}</span><div class="track"><div class="fill" style="width:${Math.round((Number(r.billed) / max) * 100)}%"></div></div><span class="n">${num(r.billed)}번</span></div>`).join('') || '<p class="mut small">최근 7일 쓴 적 없음</p>'
  const scale = [1000, 10000, 50000].map((rides) => {
    if (ratio == null) return ''
    const over = Math.max(0, Math.round(rides * ratio) - DIR_FREE_MONTH)
    return `<tr><td>한 달 주행 ${num(rides)}건</td><td class="n">${won(over * DIR_UNIT_WON)}</td></tr>`
  }).join('')
  return `<section>${head}
  <p class="lead">한 달에 6만 번까지 무료, 넘으면 한 번에 5원이에요. 무료량의 80%를 넘으면 개발자에게 알려 주세요.</p>
  <p style="margin:0 0 12px">${pill(state, STATE_TEXT[state])} 이번 달 무료량의 <b>${p}%</b> 사용</p>
  <div class="kpis">
    ${kpi(unit(num(month), '번'), '이번 달 쓴 횟수')}
    ${kpi(won(Math.max(0, month - DIR_FREE_MONTH) * DIR_UNIT_WON), '이번 달 예상 요금')}
    ${kpi(unit(num(k.billed24), '번'), '최근 24시간')}
    ${kpi(ratio == null ? '—' : unit(`약 ${ratio}`, '번'), '주행 1건당(7일)')}
  </div>
  <h3>최근 7일 어디에 썼나 <small>${num(b7)}번</small></h3>${bars}
  ${scale ? `<h3>사용자가 늘면 한 달 요금 <small>지금 비율로 어림</small></h3><div class="tw"><table>${scale}</table></div>` : ''}
</section>`
}

function renderCapacity() {
  const s = sec('capacity')
  const head = '<h2>저장 공간</h2>'
  if (!s.ok) return `<section>${head}${failBox(s)}</section>`
  const { k, buckets, hist } = s.data
  const first = (hist ?? [])[0]
  const since = first ? `${Number(first.d.slice(5, 7))}/${Number(first.d.slice(8, 10))}부터` : ''
  const grow = (cur, old, f) => (first && isNum(old) ? `<span class="mut small">${since} ${Number(cur) - Number(old) >= 0 ? '+' : ''}${f(Number(cur) - Number(old))}</span>` : '')
  const top = buckets.slice(0, 5)

  if (rest.length) rows.push(`<tr><td>그 밖 ${rest.length}종</td><td class="n">${num(rest.reduce((t, b) => t + Number(b.n), 0))}개</td><td class="n">${bytes(rest.reduce((t, b) => t + Number(b.size), 0))}</td></tr>`)
  return `<section>${head}<p class="lead">서버에 쌓인 자료의 크기예요. 며칠 사이 갑자기 크게 늘면 개발자에게 알려 주세요.</p>
  <div class="kpis">

</section>`
}

function freshRows() {
  const s = sec('fresh')
  if (!s.ok) return []
  const { ex, rows } = s.data
  const out = []
  const days = (d) => (d ? mins(d) / 1440 : null)
  if (ex.cams && rows.cams) {
    const { ok, last, bundle } = rows.cams
    const failed = last?.status === 'failed'
    const late = !ok || days(ok.finished_at) > 8
    out.push({ name: '과속 단속 카메라 목록', at: ok?.finished_at, amount: bundle ? `${num(bundle.camera_count)}대` : '없음', state: failed ? 'bad' : late ? 'warn' : 'ok', why: failed ? '마지막 갱신 실패' : late ? '8일 넘게 갱신 안 됨(주 1회)' : '주 1회 갱신' })
  }
  if (ex.fuel && rows.fuel) {
    const today = Number(rows.fuel.today ?? 0)
    out.push({ name: '주유소 가격', at: rows.fuel.last_fetch ?? rows.fuel.last_price, amount: `주유소 ${num(rows.fuel.stations)}곳 · 오늘 ${num(today)}/${OPINET_DAILY_CAP}번`, state: today >= OPINET_DAILY_CAP ? 'warn' : 'ok', why: today >= OPINET_DAILY_CAP ? '오늘 조회 한도를 다 썼어요' : '필요할 때 받아 2시간 보관' })
  }
  const tiles = rows.tiles ?? []
  for (const [name, label] of [['korea.pmtiles', '지도(한국)'], ['japan.pmtiles', '지도(일본)']]) {
    const t = tiles.find((x) => x.name === name)
    if (!t) { out.push({ name: label, at: null, amount: '파일 없음', state: 'warn', why: '지도 파일이 없어요' }); continue }
    const late = days(t.updated_at) > 120
    out.push({ name: label, at: t.updated_at, amount: bytes(t.size), state: late ? 'warn' : 'ok', why: late ? '120일 넘게 갱신 안 됨(분기 1회)' : '분기 1회 갱신' })
  }
  if (ex.bans && rows.bans) {
    const late = days(rows.bans.snapshot) > 120
    out.push({ name: '이륜차 금지 도로', at: rows.bans.snapshot, amount: `${num(rows.bans.banned)}구간`, state: late ? 'warn' : 'ok', why: late ? '120일 넘게 갱신 안 됨' : '' })
  }
  return out
}

// ── 서버 여유(0350) — Supabase 플랜·컴퓨트를 올릴 때인가 ──────────────
// 숫자는 둘에서 온다: 'health'(DB 안에서 5분마다) · 'infra'(Edge ops-snapshot 이 관리 API로 15분마다).
// 플랜별 포함량 — Supabase 가격표(supabase.com/pricing · 2026-10 기준). 바뀌면 여기만 고친다.
//   Free: 넘으면 멈춘다(DB는 읽기 전용이 된다) → 미리 올려야 한다
//   Pro·Team: 넘어도 안 멈추고 쓴 만큼 더 낸다 → 「요금이 늘어나는 때」로 읽는다
const GB = 1024 ** 3
const PLANS = {
  free: { label: '무료(Free)', hard: true, db: 0.5 * GB, storage: 1 * GB, mau: 50000, edge: 500000, rt: 200 },
  pro: { label: 'Pro', hard: false, db: 8 * GB, storage: 100 * GB, mau: 100000, edge: 2000000, rt: 500 },
  team: { label: 'Team', hard: false, db: 8 * GB, storage: 100 * GB, mau: 100000, edge: 2000000, rt: 500 },
}
// 컴퓨트 크기 · 직접 연결 한도 · 메모리 (Supabase 문서 「Compute and Disk」) — 「한 단계 위」 안내용
const COMPUTE = [['nano', 'Nano', 60, '0.5GB'], ['micro', 'Micro', 60, '1GB'], ['small', 'Small', 90, '2GB'], ['medium', 'Medium', 120, '4GB'],
  ['large', 'Large', 160, '8GB'], ['xl', 'XL', 240, '16GB'], ['2xl', '2XL', 380, '32GB'], ['4xl', '4XL', 480, '64GB']]
// 증설 신호 기준 [노랑, 빨강] — 근거:
const HEALTH_RULES = {
  quota: [70, 90], // 포함량 대비 %. Free 는 100%에서 멈추고, 플랜 변경·결제 확인에 하루 이틀 걸려 70%에서 미리 본다
  // 연결 판정은 「실행 중」 수로 한다(2026-10-26 — 43/60 노란 줄이 떴는데 실행 중은 1개였다).
  // 전체 수는 API·저장소가 미리 열어 둔 쉬는 연결(풀)이 대부분이라 사용자가 늘어도 풀 상한에서 멈춘다
  connsActive: [8, 15], // 실행 중인 연결 수 — 꾸준히 넘으면 컴퓨트를 올릴 때
  conns: [85, 95], // 전체 / 최대 연결 % — 쉬는 연결 포함. 여기까지 차면 풀 설정부터 본다
  cache: [99, 95], // 캐시 적중률 %(이 아래로 내려가면). Supabase 문서: 99% 아래면 자주 쓰는 자료가 메모리에 다 안 들어간다 → 컴퓨트(메모리)
  err5: [0.5, 1], // 5xx 비율 %(24시간 · 요청 1,000건 넘을 때만 판정). 1% = 100번에 한 번 실패
  p95: [1000, 2000], // 자료 읽기(REST) 응답 느린 쪽 5%의 시간 ms. 1초를 넘으면 앱이 느리다고 느낀다
  rt: [1, 20], // Realtime 「연결 풀을 늘려라」 경고(24시간). 동시 접속 한도에 닿았다는 경고는 한 번이라도 빨강
  days: [60, 14], // 지금 늘어나는 속도로 DB가 포함량에 닿기까지 남은 날(이 안이면)
  stale: 40, // 'infra' 가 이보다 오래되면(분) 플랜·API 숫자를 「오래됨」으로 본다(15분마다 들어온다)
}
const TABLES = {
  riding_routes: '주행 기록', riding_points: '주행 경로 점', ops_snapshots: '운영판 집계', notifications: '알림', user_profiles: '프로필',
  posts: '글', comments: '댓글', direct_messages: '1:1 메시지', group_messages: '대화방 메시지', route_photos: '주행 사진',
  group_ride_sessions: '그룹 방', group_ride_participants: '그룹 방 참가자', crews: '크루', follows: '팔로우', users: '사용자',
  directions_calls: '길찾기 기록', fuel_stations: '주유소', motorway_ban_ways: '이륜차 금지 도로', ops_daily_seen: '운영판 하루 접속',
}
const SVC = { rest: '자료 읽기·쓰기', auth: '로그인', storage: '사진·파일', realtime: '실시간 연결', functions: '앱 서버 기능', other: '그 밖' }

/** 신호 목록 + 한 줄 판정. 숫자가 없으면 그 신호는 건너뛴다(못 읽은 것을 「정상」이라 하지 않는다 — 따로 적는다) */
function healthVerdict() {
  const h = sec('health'), inf = sec('infra'), mg = sec('mgmt')
  if (!h.ok) return null
  const k = h.data.k, I = inf.ok ? inf.data : null
  const plan = PLANS[I?.plan] ?? null
  const ci = COMPUTE.findIndex((c) => c[0] === I?.compute?.size)
  const next = ci >= 0 ? COMPUTE[Math.min(ci + 1, COMPUTE.length - 1)] : null
  const actPlan = plan?.hard ? '플랜 올리기(무료 → Pro)' : '쓴 만큼 요금이 늘어요(멈추지는 않음) — 요금 확인'
  const actCompute = next && ci >= 0 ? `컴퓨트 한 단계 올리기(${COMPUTE[ci][1]} → ${next[1]})` : '컴퓨트 올리기'
  const signals = []
  const lvl = (v, [y, r], lower = false) => (lower ? (v < r ? 'bad' : v < y ? 'warn' : 'ok') : (v >= r ? 'bad' : v >= y ? 'warn' : 'ok'))
  const quota = (what, cur, lim, extra = '') => {
    if (!isNum(cur) || !lim) return
    const p = (Number(cur) / lim) * 100
    signals.push({ state: lvl(p, HEALTH_RULES.quota), what, why: `포함량의 ${Math.round(p)}%${extra}`, act: actPlan })
  }
  if (plan) {
    quota('기록 저장소(DB) 용량', k.db_bytes, plan.db)
    quota('사진·파일 용량', h.data.storage?.total, plan.storage)
    quota('한 달 사용자(MAU)', k.mau, plan.mau)
    const ec = mg.ok && mg.data.edgeErr && !mg.data.edgeErr.error ? Number(mg.data.edgeErr.calls) * 30 : null
    quota('앱 서버 기능 호출(한 달 어림)', ec, plan.edge, ' · 하루치 × 30')
  }
  if (isNum(k.conns) && Number(k.conns_max) > 0) {
    const p = (Number(k.conns) / Number(k.conns_max)) * 100
    signals.push({ state: lvl(p, HEALTH_RULES.conns), what: '동시 연결(쉬는 연결 포함)', why: `${num(k.conns)} / ${num(k.conns_max)}개 (${Math.round(p)}%) · 실행 중 ${num(k.conns_active)}`, act: '쉬는 연결(API·저장소 풀)이 대부분 — 실행 중 수가 낮으면 올릴 필요 없음 · 풀 크기 설정 확인' })
  }
  if (isNum(k.conns_active)) {
    signals.push({ state: lvl(Number(k.conns_active), HEALTH_RULES.connsActive), what: '실행 중인 연결', why: `${num(k.conns_active)}개`, act: actCompute })
  }
  if (isNum(k.cache_hit)) signals.push({ state: lvl(Number(k.cache_hit), HEALTH_RULES.cache, true), what: '캐시 적중률', why: `${num(k.cache_hit, 2)}%`, act: actCompute })
  const rest = I?.api?.by?.find((x) => x.svc === 'rest')
  if (isNum(rest?.p95)) signals.push({ state: lvl(Number(rest.p95), HEALTH_RULES.p95), what: '자료 읽기 속도', why: `느린 쪽 5%가 ${num(rest.p95)}ms`, act: actCompute })
  const ratio = (n, e) => (Number(n) >= 1000 ? (Number(e) / Number(n)) * 100 : null)
  const ar = I?.api ? ratio(I.api.n, I.api.e5) : null
  if (ar != null) signals.push({ state: lvl(ar, HEALTH_RULES.err5), what: '서버 오류 비율(API)', why: `${ar.toFixed(2)}% · ${num(I.api.e5)}건`, act: '오류부터 확인(증설로 안 풀릴 수 있어요)' })
  const er = mg.ok && mg.data.edgeErr && !mg.data.edgeErr.error ? ratio(mg.data.edgeErr.calls, mg.data.edgeErr.e5) : null
  if (er != null) {
    // 마지막 오류가 1시간 넘게 지났으면 「끝난 일」 — 빨강을 노랑으로 낮춘다(비율은 24시간 창이라 하루 종일 남는다)
    const ee = mg.data.edgeErr
    const lastMs = ee.last5 ? Date.now() - Date.parse(ee.last5) : null
    let st = lvl(er, HEALTH_RULES.err5)
    // 마지막 오류가 1시간 넘게 지났으면 끝난 일 — 판정(올릴 때인가)에 넣지 않는다(2026-10-26 사용자 「계속 떠 있네」)
    if (lastMs != null && lastMs > 3600e3) st = 'ok'
    const act = lastMs != null && lastMs > 3600e3 ? '지난 일 — 그 뒤로 오류 없음 · 같은 일이 또 나지 않게 원인만 확인' : '오류부터 확인(증설로 안 풀릴 수 있어요)'
    signals.push({ state: st, what: '앱 서버 기능 오류 비율', why: `${er.toFixed(2)}%${edgeErrWhere(ee)}`, act })
  }
  if (I?.rtlog) {
    if (Number(I.rtlog.limit) > 0) signals.push({ state: 'bad', what: '실시간 연결 한도', why: `한도에 닿았다는 경고 ${num(I.rtlog.limit)}번(24시간)`, act: plan?.hard ? '플랜 올리기(동시 접속 200 → 500)' : 'Realtime 한도 올리기(지원 요청)' })
    else signals.push({ state: lvl(Number(I.rtlog.pool), HEALTH_RULES.rt), what: '실시간 연결 풀', why: Number(I.rtlog.pool) ? `「연결 풀을 늘려라」 경고 ${num(I.rtlog.pool)}번(24시간)` : '경고 없음', act: `Realtime 연결 풀 늘리기(설정 · 지금 ${num(I.rt?.pool)})` })
  }
  const run = healthRunway(h.data.hist, plan)
  if (run && run.days != null) signals.push({ state: lvl(run.days, HEALTH_RULES.days, true), what: 'DB가 포함량에 닿을 때', why: `지금 속도면 약 ${num(run.days)}일 뒤`, act: actPlan })
  const rank = { ok: 0, warn: 1, bad: 2 }
  const state = signals.reduce((m, x) => (rank[x.state] > rank[m] ? x.state : m), 'ok')
  return { state, signals, plan, next, ci, run, I }
}

/** DB 크기 하루 증가량(최근 7일 · 사흘 이상 쌓였을 때) → 포함량에 닿기까지 남은 날 */
function healthRunway(hist, plan) {
  const pts = (hist ?? []).filter((x) => isNum(x.db)).slice(-8)
  if (pts.length < 3 || !plan) return null
  const a = pts[0], b = pts[pts.length - 1]
  const span = (new Date(b.d) - new Date(a.d)) / 86400000
  if (span < 2) return null
  const perDay = (Number(b.db) - Number(a.db)) / span
  const left = plan.db - Number(b.db)
  return { perDay, days: perDay > 0 ? Math.max(0, Math.round(left / perDay)) : null }
}

/** 한도 막대 한 줄 */
function meter(label, cur, lim, fmt, delta = '', note = '') {
  if (!isNum(cur)) return `<div class="barrow meter"><span>${esc(label)}</span><div class="track"></div><span class="n mut">못 읽었어요</span></div>`
  const p = lim ? Math.min(100, (Number(cur) / lim) * 100) : null
  const st = p == null ? 'ok' : p >= HEALTH_RULES.quota[1] ? 'bad' : p >= HEALTH_RULES.quota[0] ? 'warn' : 'ok'
  const color = st === 'bad' ? 'var(--bad)' : st === 'warn' ? 'var(--warn)' : 'var(--bar)'
  return `<div class="barrow meter"><span>${esc(label)}${note ? `<div class="mut small">${note}</div>` : ''}</span>
    <div class="track" title="${p == null ? '' : `${p.toFixed(1)}%`}"><div class="fill" style="width:${p == null ? 0 : Math.max(p, 1).toFixed(1)}%;background:${color}"></div></div>
    <span class="n">${fmt(cur)}${lim ? ` <span class="mut">/ ${fmt(lim)}</span>` : ''} ${delta}</span></div>`
}

/** DB 크기 하루 막대(포함량 선은 높이가 맞을 때만) */
function sizeChart(hist, key, label, lim) {
  const days = (hist ?? []).filter((x) => isNum(x[key])).slice(-30)
  if (!days.length) return ''
  const vals = days.map((x) => Number(x[key]))
  const max = Math.max(1, ...vals)
  const W = 280, H = 90, top = 14, bottom = 16, gap = 3
  const bw = Math.min(40, (W - gap * (days.length - 1)) / days.length) // 며칠 안 쌓였을 때 막대 하나가 판을 다 덮지 않게
  const bars = vals.map((v, i) => {
    const h = Math.max(2, ((H - top - bottom) * v) / max)
    return `<rect x="${(i * (bw + gap)).toFixed(1)}" y="${(H - bottom - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${i === days.length - 1 ? 'var(--bar3)' : 'var(--bar)'}"><title>${esc(String(days[i].d).slice(5).replace('-', '/'))} ${bytes(v)}</title></rect>`
  }).join('')
  const md = (s) => `${Number(String(s).slice(5, 7))}/${Number(String(s).slice(8, 10))}`
  return `<div class="chart" role="img" aria-label="${esc(label)} 하루 단위">
    <div class="t"><b>${esc(label)}</b><span class="mut">${days.length}일 · 오늘 ${bytes(vals[vals.length - 1])}${lim ? ` · 포함량 ${bytes(lim)}` : ''}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="0" y1="${H - bottom}" x2="${W}" y2="${H - bottom}" stroke="var(--line)"></line>
      <text x="0" y="10" font-size="10" fill="var(--mut)">최고 ${bytes(max)}</text>${bars}
      <text x="0" y="${H - 3}" font-size="10" fill="var(--mut)">${md(days[0].d)}</text>
      <text x="${W}" y="${H - 3}" font-size="10" fill="var(--mut)" text-anchor="end">오늘</text>
    </svg>
    ${days.length < 3 ? '<div class="mut small">0350이 들어간 날부터 하루 한 줄씩 쌓여요 — 사흘이 지나면 「언제 닿나」를 어림해요.</div>' : ''}
  </div>`
}

function tick() {
  const a = $('agoText')
  if (a && newest) a.textContent = `${when(newest)} · ${ago(newest)}`
  const r = $('readAt')
  if (r && lastRead) r.textContent = `화면 새로 읽음 ${clock(lastRead)}`
}

async function load(manual) {
  const btn = $('reloadBtn')
  if (manual && btn) btn.disabled = true
  const [{ data, error }, ago24] = await Promise.all([sb.rpc('ops_latest_snapshots'), sb.rpc('ops_snapshots_ago')])
  if (error) {
    if (/JWT|jwt|401/.test(error.message ?? '')) return gate()
    const r = $('readAt')
    if (r) r.textContent = '다시 읽기에 실패했어요 — 잠시 뒤 다시 눌러 주세요'
    if (btn) btn.disabled = false
    return
  }
  if (!data.length) {
    const staff = await sb.rpc('is_ops_staff')
    if (staff.data !== true) { clearInterval(timer); show('denied'); return }
  }
  S = Object.fromEntries(data.map((r) => [r.section, r]))
  A = Object.fromEntries((ago24.data ?? []).map((r) => [r.section, r]))
  newest = data.reduce((m, r) => (!['mgmt', 'infra', 'health', 'settle', 'reviews', 'crashes'].includes(r.section) && (!m || r.taken_at > m) ? r.taken_at : m), null)
  lastRead = new Date()
  paint()
  show('app')
}

async function gate() {
  clearInterval(timer)
  const { data: { session } } = await sb.auth.getSession()
  if (!session) { $('loginTag').textContent = isProd ? '' : '개발 서버'; show('login'); return }
  const { data, error } = await sb.rpc('is_ops_staff')
  if (error) { await sb.auth.signOut(); show('login'); return }
  if (data !== true) { show('denied'); return }
  await load()
  timer = setInterval(() => { if (!document.hidden) load() }, RELOAD_MS)
}

async function logout() {
  clearInterval(timer)
  await sb.auth.signOut()
  S = {}; A = {}; newest = null
  $('app').innerHTML = ''
  $('loginPw').value = ''
  show('login')
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault()
  const id = $('loginId').value.trim()
  const pw = $('loginPw').value
  const err = $('loginErr')
  err.textContent = ''
  if (!id || !pw) { err.textContent = '아이디와 비밀번호를 넣어 주세요.'; return }
  const email = LOGIN_IDS[id.toLowerCase()] ?? id
  const btn = $('loginBtn')
  btn.disabled = true
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: pw })
    if (error) { err.textContent = '아이디 또는 비밀번호가 맞지 않습니다.'; return }
    $('loginPw').value = ''
    await gate()
  } finally {
    btn.disabled = false
  }
})
$('deniedOut').onclick = logout
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('app').hidden) load() })
setInterval(tick, 15000)
gate()
</script>
</body></html>
