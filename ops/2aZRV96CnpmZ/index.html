<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-FvSVklVW1k3tib80istO4kG5sUq10gLEf/voPYd4YXY=' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js; style-src 'unsafe-inline'; connect-src https://oefeqwkvbnhlkwjpvpwv.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<title>Rideon 운영판</title>
<style>
:root{--bg:#f5f6f3;--fg:#15171a;--mut:#5d646c;--card:#ffffff;--line:#e2e5e0;--acc:#4f7a00;--accbg:#eef7d9;--warn:#a14a00;--warnbg:#fff1dc;--bad:#c42b2b;--badbg:#fde8e8;--bar:#8fbf1f;--bar2:#d9dfd2;--bar3:#c9d3bd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e10;--fg:#eef0f2;--mut:#a0a7af;--card:#17191c;--line:#2a2d31;--acc:#c9f53d;--accbg:#22300a;--warn:#fbbf24;--warnbg:#2e2106;--bad:#ff7070;--badbg:#3a1414;--bar:#c9f53d;--bar2:#33373c;--bar3:#4a4f55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0e10;--fg:#eef0f2;--mut:#a0a7af;--card:#17191c;--line:#2a2d31;--acc:#c9f53d;--accbg:#22300a;--warn:#fbbf24;--warnbg:#2e2106;--bad:#ff7070;--badbg:#3a1414;--bar:#c9f53d;--bar2:#33373c;--bar3:#4a4f55;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;margin:0;padding-block:20px;padding-inline:16px;font-size:14px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:16px}
header h1{font-size:24px;margin:0;letter-spacing:-.02em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header p{margin:4px 0 0;color:var(--mut);font-size:13px}
header .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
h2{font-size:16px;margin:0 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 small,h3 small{color:var(--mut);font-weight:400;font-size:12px}
h3{font-size:14px;margin:16px 0 8px}
.lead{color:var(--mut);font-size:13px;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:14px 12px}
.k b{display:block;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.25}
.k b small{font-size:13px;font-weight:500;color:var(--mut);margin-left:2px}
.k span.l{color:var(--mut);font-size:12px;display:block}
.d{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.d.good{color:var(--acc)} .d.bad{color:var(--bad)} .d.eq{color:var(--mut);font-weight:400}
.today{border:2px solid var(--acc)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.barrow{display:grid;grid-template-columns:110px 1fr 52px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.track{height:10px;background:var(--bar2);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--bar);border-radius:5px}
.mut{color:var(--mut)}
.small{font-size:12px}
.st{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--accbg);color:var(--fg)}
.st.warn{background:var(--warnbg);color:var(--warn)}
.st.bad{background:var(--badbg);color:var(--bad)}
.st.info{background:var(--bar2);color:var(--fg);font-weight:500}
.verdict{border-radius:16px;padding:14px 18px;border:2px solid var(--acc);background:var(--accbg)}
.verdict.warn{border-color:var(--warn);background:var(--warnbg)}
.verdict.bad{border-color:var(--bad);background:var(--badbg)}
.verdict b{font-size:18px;display:block}
.verdict ul{margin:6px 0 0;padding-left:0;list-style:none;display:grid;gap:4px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.chart svg{width:100%;height:auto;display:block}
.chart .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.chart .t b{font-weight:600}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--bar2);color:var(--fg)}
.tag.dev{background:var(--warnbg);color:var(--warn)}
button{font:inherit;font-size:13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;cursor:pointer;min-height:36px}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
button:disabled{opacity:.55;cursor:default}
details.dev summary{cursor:pointer;font-weight:600;font-size:15px}
details.dev{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.gate{max-width:360px;margin:12vh auto 0;display:grid;gap:14px}
.gate h1{font-size:22px;margin:0;letter-spacing:-.02em}
.gate label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.gate input{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;box-sizing:border-box;width:100%}
.gate input:focus{outline:2px solid var(--acc);outline-offset:1px}
.err{color:var(--bad);font-size:13px;min-height:1.5em;margin:0}
[hidden]{display:none!important}
</style>
</head><body>

<section class="gate" id="login" hidden>
  <h1>Rideon 운영판 <span class="tag dev" id="loginTag"></span></h1>
  <p class="mut" style="margin:0;font-size:13px">운영진 전용입니다.</p>
  <form id="loginForm" autocomplete="on" novalidate>
    <div style="display:grid;gap:12px">
      <label>아이디<input id="loginId" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label>비밀번호<input id="loginPw" name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" id="loginBtn" type="submit">들어가기</button>
      <p class="err" id="loginErr" role="alert"></p>
    </div>
  </form>
</section>

<section class="gate" id="denied" hidden>
  <h1>권한 없음</h1>
  <p class="mut" style="margin:0">이 계정은 운영판을 볼 수 없습니다.</p>
  <button id="deniedOut" type="button">로그아웃</button>
</section>

<div class="wrap" id="app" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js" integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+" crossorigin="anonymous"></script>
<script>
'use strict'
// 빌드가 채운다(tool/ops_web_build.mjs --target dev|prod). anon 키는 앱에도 박혀 있는 공개 키다.
// 서비스 키·관리 토큰·비밀번호는 이 파일에 없다. 운영진 대부분이 개발자가 아니다 — 화면엔 쉬운 말만,
// 기술 상세는 맨 아래 「개발자용 자세히」 한 곳에.
const CFG = {"target":"prod","url":"https://oefeqwkvbnhlkwjpvpwv.supabase.co","anon":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lZmVxd2t2Ym5obGt3anB2cHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NjQ5MDMsImV4cCI6MjEwMzE0MDkwM30.6FsToBVliUCz-bPfGdEpEKEk7MzoeM2nDbdHesd3KfQ"}
const LOGIN_IDS = { admin: 'ops-admin@rideon-app.com' }
const RELOAD_MS = 60000
const STALE_SNAPSHOT_MIN = 15
const isProd = CFG.target === 'prod'

const sb = window.supabase.createClient(CFG.url, CFG.anon, {
  auth: { storageKey: `rideon-ops-${CFG.target}`, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
})

// ── 형식 ───────────────────────────────────────────────────
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const isNum = (n) => n != null && n !== '' && !Number.isNaN(Number(n))
const num = (n, digits = 0) => (!isNum(n) ? '—' : Number(n).toLocaleString('ko-KR', { maximumFractionDigits: digits, minimumFractionDigits: 0 }))
const kst = (d) => Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
  timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
}).formatToParts(new Date(d)).map((p) => [p.type, p.value]))
const kstDate = (d) => { const p = kst(d); return `${p.year}-${p.month}-${p.day}` }
function clock(d) {
  const p = kst(d); const h = Number(p.hour)
  return `${h < 12 ? '오전' : '오후'} ${h % 12 === 0 ? 12 : h % 12}:${p.minute}`
}
function when(d) {
  if (!d) return '—'
  const today = kstDate(new Date()), yest = kstDate(new Date(Date.now() - 86400000)), day = kstDate(d)
  if (day === today) return `오늘 ${clock(d)}`
  if (day === yest) return `어제 ${clock(d)}`
  const p = kst(d)
  return `${Number(p.month)}/${Number(p.day)} ${clock(d)}`
}
const mins = (d) => (d ? (Date.now() - new Date(d).getTime()) / 60000 : null)
function ago(d) {
  const m = mins(d)
  if (m == null) return ''
  if (m < 1) return '방금'
  if (m < 60) return `${Math.round(m)}분 전`
  if (m < 1440) return `${Math.round(m / 60)}시간 전`
  return `${Math.round(m / 1440)}일 전`
}
function bytes(b) {
  const mb = Number(b) / 1048576
  if (!Number.isFinite(mb)) return '—'
  if (Math.abs(mb) >= 1024) return `${(mb / 1024).toFixed(1)} GB`
  if (Math.abs(mb) >= 10) return `${Math.round(mb)} MB`
  if (Math.abs(mb) >= 0.1) return `${mb.toFixed(1)} MB`
  return `${Math.round(Number(b) / 1024)} KB`
}
function won(n) {
  if (n <= 0) return '0원'
  if (n < 10000) return `${num(n)}원`
  return `약 ${num(Math.round(n / 10000))}만 원`
}
const pctOf = (a, b) => (b ? Math.round((a / b) * 100) : null)
const unit = (v, u) => `${v}<small>${u}</small>`

/** 어제 이맘때보다 — bad: 늘면 나쁜 값(빨강) */
function dl(cur, prev, { bad = false, digits = 0 } = {}) {
  if (!isNum(cur) || !isNum(prev)) return ''
  const diff = Number(cur) - Number(prev)
  const r = Math.round(diff * 10 ** digits) / 10 ** digits
  if (r === 0) return '<span class="d eq" title="어제 이맘때와 같음">–</span>'
  const up = r > 0
  const cls = (up !== bad) ? 'good' : 'bad'
  return `<span class="d ${cls}" title="어제 이맘때보다">${up ? '▲' : '▼'}${num(Math.abs(r), digits)}</span>`
}
const kpi = (value, label, delta = '') => `<div class="k"><b>${value}</b><span class="l">${esc(label)} ${delta}</span></div>`
const pill = (state, text) => `<span class="st ${state}">${esc(text)}</span>`
const STATE_TEXT = { ok: '정상', warn: '주의', bad: '문제', info: '참고' }

// ── 이름표 ─────────────────────────────────────────────────
const REASONS = {
  reroute: '길 벗어나 다시 찾기', course_link: '코스로 가는 길', start: '길안내 시작', room_nav: '그룹 방 길안내', rally: '집결지 가는 길',
  edit: '경로 고치기', course_voice: '코스 음성 안내', course_line: '안내선 얹기', unknown: '옛 앱(이유 모름)',
}
const REPORT_TYPES = { user: '사용자', post: '글', comment: '댓글', direct_message: '1:1 메시지', group_message: '대화방 메시지', group_ride: '그룹 방', crew: '크루', crew_notice: '크루 공지' }
const REPORT_REASONS = { spam: '스팸·광고', abuse: '욕설·괴롭힘', sexual: '음란', violence: '폭력', fake: '사칭·거짓', other: '기타' }
const BUCKETS = { 'route-thumbnails': '지도 그림', maptiles: '지도 타일', 'post-images': '글 사진', avatars: '프로필 사진', 'dm-images': '메시지 사진', 'group-images': '대화방 사진', 'bike-photos': '바이크 사진', 'crew-emblems': '크루 엠블럼' }
function notifKind(t) {
  t = String(t ?? '')
  if (t.startsWith('group_ride')) return '그룹 라이딩'
  if (t.startsWith('crew')) return '크루'
  if (t.includes('follow')) return '팔로우'
  if (t.includes('comment')) return '댓글'
  if (t.includes('like')) return '좋아요'
  if (t.includes('mention')) return '멘션'
  if (t.includes('group') || t.includes('chat')) return '대화방'
  if (t.includes('official') || t.includes('notice')) return '공지'
  return '그 밖'
}

// ── 상태 ───────────────────────────────────────────────────
let S = {}, A = {}
const sec = (name, src = S) => {
  const r = src[name]
  if (!r) return { ok: false, at: null, error: '아직 집계 없음' }
  return { ok: r.ok, at: r.taken_at, data: r.payload, error: r.payload?.error ?? (r.ok ? null : '실패') }
}
const failBox = (s) => `<p class="st warn" style="display:block;padding:8px 12px;border-radius:10px">이 칸의 숫자를 지금 못 읽었어요 — 개발자에게 알려 주세요.</p>`
const T = () => sec('today').ok ? sec('today').data : null
const tnow = (k) => T()?.now?.[k]
const tprev = (k) => T()?.prev?.[k]
const STALE_RIDING_H = 6
const ridingNow = (u, ref = Date.now()) => (u?.riding ?? []).filter((r) => ref - new Date(r.since).getTime() <= STALE_RIDING_H * 3600000)
/** 24시간 「눈에 띄는」 오류 = 앱 서버 기능 오류(5xx) + 보내지 못한 알림. 기록 저장소 로그 오류는 정상 동작의
 *  권한 거절까지 섞여 수가 크게 흔들려(수만~수십만) 여기 더하지 않는다 — 서버 상태 칸에 참고로만 */
function errors24(mg, pushFail) {
  const ed = mg?.edgeErr && !mg.edgeErr.error ? Number(mg.edgeErr.e5) : null
  if (ed == null && !isNum(pushFail)) return null
  return (ed ?? 0) + (isNum(pushFail) ? Number(pushFail) : 0)
}

// ── 확인할 것 ───────────────────────────────────────────────
function issues(newest) {
  const out = []
  const add = (state, text) => out.push({ state, text })
  const m = mins(newest)
  if (m == null || m > STALE_SNAPSHOT_MIN) add('bad', `운영판 숫자가 ${m == null ? '아직' : `${Math.round(m)}분째`} 새로 안 들어와요 — 개발자에게 알려 주세요`)
  const failed = Object.entries(S).filter(([, r]) => !r.ok).map(([k]) => k)
  if (failed.length) add('warn', `일부 칸(${failed.length}개)의 숫자를 못 읽었어요`)
  const open = tnow('reports_open')
  if (Number(open) > 0) {
    const old = sec('reports').ok ? sec('reports').data.oldest_open_at : null
    const late = old && mins(old) > 1440
    add(late ? 'bad' : 'warn', `처리 안 된 신고 ${num(open)}건${late ? ` — 가장 오래된 것이 ${ago(old)}` : ''}`)
  }
  if (Number(tnow('push_fail24')) > 0) add('warn', `최근 24시간 보내지 못한 알림 ${num(tnow('push_fail24'))}건`)
  const mg = sec('mgmt').ok ? sec('mgmt').data : null
  if (Number(mg?.edgeErr?.e5) > 0) add('warn', `앱 서버 기능 오류 ${num(mg.edgeErr.e5)}건(24시간)`)
  const down = (mg?.fns ?? []).filter((f) => f.status !== 'ACTIVE')
  if (down.length) add('bad', `멈춘 앱 서버 기능 ${down.length}개`)
  const dir = sec('directions')
  if (dir.ok) { const p = pctOf(Number(dir.data.k.billed_month), DIR_FREE_MONTH); if (p >= 80) add(p >= 100 ? 'bad' : 'warn', `네이버 길찾기 이번 달 무료량의 ${p}% 사용`) }
  const st = sec('status')
  if (st.ok && Number(st.data.thumb.pending) > 20) add('warn', `지도 그림 만들기 대기 ${num(st.data.thumb.pending)}건`)
  for (const r of freshRows()) if (r.state === 'warn' || r.state === 'bad') add(r.state, `${r.name} — ${r.why || STATE_TEXT[r.state]}`)
  return out
}

function renderHeader(newest) {
  const list = issues(newest)
  const worst = list.some((x) => x.state === 'bad') ? 'bad' : list.length ? 'warn' : 'ok'
  const verdict = list.length
    ? `<div class="verdict ${worst}" role="status"><b>확인할 것 ${list.length}개</b><ul>${list.map((x) => `<li>${pill(x.state, STATE_TEXT[x.state])} ${esc(x.text)}</li>`).join('')}</ul></div>`
    : '<div class="verdict" role="status"><b>오늘은 문제 없어요</b><span class="small">신고·알림·서버·외부 자료 모두 정상이에요.</span></div>'
  return `<header>
  <h1>Rideon 운영판 <span class="tag ${isProd ? '' : 'dev'}">${isProd ? '실서비스' : '개발 서버'}</span></h1>
  <p>숫자는 서버가 5분마다 새로 세고, 이 화면은 1분마다 다시 읽어요. 마지막으로 센 때: <b id="agoText">${newest ? `${when(newest)} · ${ago(newest)}` : '—'}</b></p>
  <div class="bar"><button id="reloadBtn" type="button">지금 다시 읽기</button><button id="logoutBtn" type="button">로그아웃</button><span class="mut small" id="readAt"></span></div>
</header>${verdict}`
}

function renderToday() {
  const u = sec('users'), ua = sec('users', A), mg = sec('mgmt'), mga = sec('mgmt', A)
  const rideNow = u.ok ? ridingNow(u.data).length : null
  const ridePrev = ua.ok ? ridingNow(ua.data, new Date(ua.at).getTime()).length : null
  const e24 = errors24(mg.ok ? mg.data : null, tnow('push_fail24'))
  const e24p = mga.ok ? errors24(mga.data, tprev('push_fail24')) : null
  const t = T()
  return `<section class="today"><h2>오늘 한눈에 <small>▲▼ = 어제 이맘때보다</small></h2>
  <p class="lead">오늘(한국 시간 0시부터) 지금까지의 숫자예요.</p>
  <div class="kpis">
    ${kpi(unit(num(tnow('users_today')), '명'), '오늘 가입', dl(tnow('users_today'), tprev('users_today')))}
    ${kpi(unit(num(tnow('rides_today')), '건'), '오늘 주행', dl(tnow('rides_today'), tprev('rides_today')))}
    ${kpi(unit(num(rideNow), '명'), '지금 주행 중', dl(rideNow, ridePrev))}
    ${kpi(unit(num(t?.dau_today), '명'), '오늘 앱 연 사람', isNum(t?.dau_yesterday) && Number(t.dau_yesterday) > 0 ? `<span class="mut small">어제 하루 ${num(t.dau_yesterday)}명</span>` : '')}
    ${kpi(unit(num(tnow('reports_open')), '건'), '처리 안 된 신고', dl(tnow('reports_open'), tprev('reports_open'), { bad: true }))}

// ── 추이 그래프(SVG · 외부 라이브러리 없음) ──────────────────
function miniChart(days, key, label, u) {
  const vals = days.map((d) => (d[key] == null ? null : Number(d[key])))
  const known = vals.filter((v) => v != null)
  const max = Math.max(1, ...known)
  const W = 280, H = 96, top = 14, bottom = 16, gap = 3
  const bw = (W - gap * (days.length - 1)) / days.length
  const bars = vals.map((v, i) => {
    const x = i * (bw + gap)
    if (v == null) return `<rect x="${x.toFixed(1)}" y="${H - bottom - 2}" width="${bw.toFixed(1)}" height="2" fill="var(--bar2)"></rect>`
    const h = Math.max(v > 0 ? 2 : 0, ((H - top - bottom) * v) / max)
    const today = i === days.length - 1
    return `<rect x="${x.toFixed(1)}" y="${(H - bottom - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${today ? 'var(--bar3)' : 'var(--bar)'}"><title>${esc(days[i].d.slice(5).replace('-', '/'))} ${num(v)}${u}${today ? ' (오늘 진행 중)' : ''}</title></rect>`
  }).join('')
  const md = (s) => `${Number(s.slice(5, 7))}/${Number(s.slice(8, 10))}`
  const sum = known.reduce((a, b) => a + b, 0)
  const todayV = vals[vals.length - 1]
  const missing = vals.some((v) => v == null)
  return `<div class="chart" role="img" aria-label="${esc(label)} 최근 14일">
    <div class="t"><b>${esc(label)}</b><span class="mut">14일 ${num(sum, key === 'km' ? 1 : 0)}${u} · 오늘 ${num(todayV, key === 'km' ? 1 : 0)}${u}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="0" y1="${H - bottom}" x2="${W}" y2="${H - bottom}" stroke="var(--line)"></line>
      <text x="0" y="10" font-size="10" fill="var(--mut)">최고 ${num(max)}${u}</text>
      ${bars}
      <text x="0" y="${H - 3}" font-size="10" fill="var(--mut)">${md(days[0].d)}</text>
      <text x="${W / 2}" y="${H - 3}" font-size="10" fill="var(--mut)" text-anchor="middle">${md(days[Math.floor(days.length / 2)].d)}</text>
      <text x="${W}" y="${H - 3}" font-size="10" fill="var(--mut)" text-anchor="end">오늘</text>
    </svg>
    ${missing ? '<div class="mut small">회색 줄 = 그날은 아직 세지 않았어요(운영판을 연 날부터 셉니다)</div>' : ''}
  </div>`
}

const DIR_UNIT_WON = 5
const DIR_FREE_MONTH = 60000
const OPINET_DAILY_CAP = 300
function renderDirections() {
  const s = sec('directions')
  const head = '<h2>네이버 길찾기 요금 <small>가장 돈이 드는 외부 서비스</small></h2>'

  const { k, reasons } = s.data
  const month = Number(k.billed_month), b7 = Number(k.billed7), rides7 = Number(k.rides7)
  const ratio = rides7 > 0 ? Math.round((b7 / rides7) * 10) / 10 : null
  const p = pctOf(month, DIR_FREE_MONTH)
  const state = p >= 100 ? 'bad' : p >= 80 ? 'warn' : 'ok'
  const max = Math.max(1, ...reasons.map((r) => Number(r.billed)))
  const bars = reasons.filter((r) => Number(r.billed) > 0).map((r) =>
    `<div class="barrow"><span>${esc(REASONS[r.reason] ?? '그 밖')}</span><div class="track"><div class="fill" style="width:${Math.round((Number(r.billed) / max) * 100)}%"></div></div><span class="n">${num(r.billed)}번</span></div>`).join('') || '<p class="mut small">최근 7일 쓴 적 없음</p>'
  const scale = [1000, 10000, 50000].map((rides) => {
    if (ratio == null) return ''
    const over = Math.max(0, Math.round(rides * ratio) - DIR_FREE_MONTH)
    return `<tr><td>한 달 주행 ${num(rides)}건</td><td class="n">${won(over * DIR_UNIT_WON)}</td></tr>`
  }).join('')
  return `<section>${head}
  <p class="lead">한 달에 6만 번까지 무료, 넘으면 한 번에 5원이에요. 무료량의 80%를 넘으면 개발자에게 알려 주세요.</p>
  <p style="margin:0 0 12px">${pill(state, STATE_TEXT[state])} 이번 달 무료량의 <b>${p}%</b> 사용</p>
  <div class="kpis">
    ${kpi(unit(num(month), '번'), '이번 달 쓴 횟수')}
    ${kpi(won(Math.max(0, month - DIR_FREE_MONTH) * DIR_UNIT_WON), '이번 달 예상 요금')}
    ${kpi(unit(num(k.billed24), '번'), '최근 24시간')}
    ${kpi(ratio == null ? '—' : unit(`약 ${ratio}`, '번'), '주행 1건당(7일)')}
  </div>
  <h3>최근 7일 어디에 썼나 <small>${num(b7)}번</small></h3>${bars}
  ${scale ? `<h3>사용자가 늘면 한 달 요금 <small>지금 비율로 어림</small></h3><div class="tw"><table>${scale}</table></div>` : ''}
</section>`
}

function renderCapacity() {
  const s = sec('capacity')
  const head = '<h2>저장 공간</h2>'
  if (!s.ok) return `<section>${head}${failBox(s)}</section>`
  const { k, buckets, hist } = s.data
  const first = (hist ?? [])[0]
  const since = first ? `${Number(first.d.slice(5, 7))}/${Number(first.d.slice(8, 10))}부터` : ''
  const grow = (cur, old, f) => (first && isNum(old) ? `<span class="mut small">${since} ${Number(cur) - Number(old) >= 0 ? '+' : ''}${f(Number(cur) - Number(old))}</span>` : '')
  const top = buckets.slice(0, 5)
  const rest = buckets.slice(5)
  const rows = top.map((b) => `<tr><td>${esc(BUCKETS[b.bucket_id] ?? '그 밖의 파일')}</td><td class="n">${num(b.n)}개</td><td class="n">${bytes(b.size)}</td></tr>`)
  if (rest.length) rows.push(`<tr><td>그 밖 ${rest.length}종</td><td class="n">${num(rest.reduce((t, b) => t + Number(b.n), 0))}개</td><td class="n">${bytes(rest.reduce((t, b) => t + Number(b.size), 0))}</td></tr>`)
  return `<section>${head}<p class="lead">서버에 쌓인 자료의 크기예요. 며칠 사이 갑자기 크게 늘면 개발자에게 알려 주세요.</p>
  <div class="kpis">
    ${kpi(bytes(k.db), '기록 저장소(데이터베이스)', grow(k.db, first?.db, bytes))}
    ${kpi(unit(num(k.pts), '개'), '주행 경로 점', grow(k.pts, first?.pts, (v) => `${num(v)}개`))}
  </div>
  <h3>사진·파일</h3>
  <div class="tw"><table><tr><th>종류</th><th class="n">개수</th><th class="n">크기</th></tr>${rows.join('')}</table></div>
</section>`
}

function freshRows() {
  const s = sec('fresh')
  if (!s.ok) return []
  const { ex, rows } = s.data
  const out = []
  const days = (d) => (d ? mins(d) / 1440 : null)
  if (ex.cams && rows.cams) {
    const { ok, last, bundle } = rows.cams
    const failed = last?.status === 'failed'
    const late = !ok || days(ok.finished_at) > 8
    out.push({ name: '과속 단속 카메라 목록', at: ok?.finished_at, amount: bundle ? `${num(bundle.camera_count)}대` : '없음', state: failed ? 'bad' : late ? 'warn' : 'ok', why: failed ? '마지막 갱신 실패' : late ? '8일 넘게 갱신 안 됨(주 1회)' : '주 1회 갱신' })
  }
  if (ex.fuel && rows.fuel) {
    const today = Number(rows.fuel.today ?? 0)
    out.push({ name: '주유소 가격', at: rows.fuel.last_fetch ?? rows.fuel.last_price, amount: `주유소 ${num(rows.fuel.stations)}곳 · 오늘 ${num(today)}/${OPINET_DAILY_CAP}번`, state: today >= OPINET_DAILY_CAP ? 'warn' : 'ok', why: today >= OPINET_DAILY_CAP ? '오늘 조회 한도를 다 썼어요' : '필요할 때 받아 2시간 보관' })
  }
  const tiles = rows.tiles ?? []
  for (const [name, label] of [['korea.pmtiles', '지도(한국)'], ['japan.pmtiles', '지도(일본)']]) {
    const t = tiles.find((x) => x.name === name)
    if (!t) { out.push({ name: label, at: null, amount: '파일 없음', state: 'warn', why: '지도 파일이 없어요' }); continue }
    const late = days(t.updated_at) > 120
    out.push({ name: label, at: t.updated_at, amount: bytes(t.size), state: late ? 'warn' : 'ok', why: late ? '120일 넘게 갱신 안 됨(분기 1회)' : '분기 1회 갱신' })
  }
  if (ex.bans && rows.bans) {
    const late = days(rows.bans.snapshot) > 120
    out.push({ name: '이륜차 금지 도로', at: rows.bans.snapshot, amount: `${num(rows.bans.banned)}구간`, state: late ? 'warn' : 'ok', why: late ? '120일 넘게 갱신 안 됨' : '' })
  }
  return out
}
function renderFresh() {
  const s = sec('fresh')
  const head = '<h2>외부 자료 최신 상태</h2>'
  if (!s.ok) return `<section>${head}${failBox(s)}</section>`
  return `<section>${head}<p class="lead">앱이 바깥에서 받아 쓰는 자료예요. 「주의」나 「문제」가 보이면 개발자에게 알려 주세요.</p>
  <div class="tw"><table><tr><th>자료</th><th>마지막 갱신</th><th>양</th><th>상태</th></tr>
  ${freshRows().map((r) => `<tr><td>${esc(r.name)}</td><td>${r.at ? `${when(r.at)} <span class="mut">${ago(r.at)}</span>` : '—'}</td><td>${r.amount}</td><td>${pill(r.state, STATE_TEXT[r.state])}${r.why ? ` <span class="mut small">${esc(r.why)}</span>` : ''}</td></tr>`).join('')}
  </table></div></section>`
}

function renderServer() {
  const st = sec('status'), mg = sec('mgmt'), mga = sec('mgmt', A)
  const head = '<h2>서버 상태</h2>'
  if (!st.ok) return `<section>${head}${failBox(st)}</section>`
  const { cron, thumb } = st.data
  const m = mg.ok ? mg.data : null
  const fns = m?.fns ?? null
  const down = (fns ?? []).filter((f) => f.status !== 'ACTIVE')
  const e5 = m?.edgeErr && !m.edgeErr.error ? Number(m.edgeErr.e5) : null
  const dbE = m?.dbErr && !m.dbErr.error ? Number(m.dbErr.total) : null
  const dbEp = mga.ok && mga.data.dbErr && !mga.data.dbErr.error ? Number(mga.data.dbErr.total) : null
  const row = (state, name, text, extra = '') => `<tr><td>${esc(name)}</td><td>${pill(state, STATE_TEXT[state])}</td><td>${text}${extra}</td></tr>`
  return `<section>${head}<p class="lead">앱 뒤에서 도는 서버가 잘 돌아가는지예요. 「문제」가 보이면 개발자에게 알려 주세요.</p>
  <div class="tw"><table><tr><th>무엇</th><th>상태</th><th>내용</th></tr>
  ${row(fns == null ? 'warn' : down.length ? 'bad' : 'ok', '앱 서버 기능', fns == null ? '목록을 못 읽었어요' : down.length ? `${down.length}개가 멈췄어요` : `${fns.length}개 모두 켜져 있어요`)}
  ${row(e5 == null ? 'info' : e5 > 0 ? 'warn' : 'ok', '앱 서버 기능 오류(24시간)', e5 == null ? '못 읽었어요' : `${num(e5)}건 · 호출 ${num(m.edgeErr.calls)}번`)}
  ${row('info', '기록 저장소 오류(24시간)', dbE == null ? '못 읽었어요' : `${num(dbE)}건`, ` ${dl(dbE, dbEp, { bad: true })} <span class="mut small">— 권한 거절처럼 정상 동작에서도 생겨요. 갑자기 크게 늘 때만 보세요</span>`)}
  ${row(Number(cron.fail7) > 0 ? 'warn' : 'ok', '서버 예약 작업', `${num(cron.active)}개 켜짐 · 지난 7일 실패 ${num(cron.fail7)}번`)}
  ${row(Number(thumb.pending) > 20 ? 'warn' : 'ok', '지도 그림 만들기', `기다리는 것 ${num(thumb.pending)}건 · 못 만든 것 ${num(thumb.gave_up)}건`)}
  </table></div></section>`
}

function renderDev(newest) {
  const meta = sec('meta'), st = sec('status'), mg = sec('mgmt'), ps = sec('push')
  const m = meta.ok ? meta.data : {}
  const g = mg.ok ? mg.data : {}
  const CODE = { '57014': '시간 초과', '42703': '없는 열', '23514': '제약 위반', '42501': '권한', P0001: '함수 거부', '40P01': '교착' }
  const fns = [...(g.fns ?? [])].sort((a, b) => String(b.updated ?? '').localeCompare(String(a.updated ?? '')))
  const edgeBy = new Map((g.edgeErr?.by ?? []).map((x) => [x.slug, x]))
  const failed = Object.entries(S).filter(([, r]) => !r.ok)
  return `<details class="dev"><summary>개발자용 자세히</summary>
  <div class="tw small" style="margin-top:10px"><table>
    <tr><td>서버 migration</td><td>${esc(m.mig ?? '—')} ${esc(m.mig_name ?? '')} · ${num(m.mig_count)}개</td></tr>
    <tr><td>업데이트 권장/최소 빌드</td><td>${esc(m.rec ?? '—')} / ${esc(m.min ?? '—')} · 바뀐 때 ${when(m.build_at)}</td></tr>
    <tr><td>마지막 스냅샷</td><td>${newest ? new Date(newest).toISOString() : '—'} · 비교용 24시간 전 스냅샷 ${Object.keys(A).length}칸</td></tr>
    ${failed.length ? `<tr><td>실패한 칸</td><td>${failed.map(([k, r]) => `${esc(k)}: ${esc(r.payload?.error)}`).join('<br>')}</td></tr>` : ''}
    <tr><td>pg_cron 7일 실패</td><td>${st.ok ? `${num(st.data.cron.fail7)}번 · ${esc(st.data.cron.fail_names ?? '없음')}` : '—'}</td></tr>
    <tr><td>DB 오류 SQLSTATE(24h)</td><td>${g.dbErr && !g.dbErr.error ? g.dbErr.top.map((x) => `${esc(x.code)}(${esc(CODE[x.code] ?? '')}) ${num(x.n)}`).join(' · ') || '없음' : esc(g.dbErr?.error ?? '—')}</td></tr>
    <tr><td>notify_failures 출처(7일)</td><td>${ps.ok ? ps.data.fail_by_source.map((x) => `${esc(x.source)} ${num(x.n)}`).join(' · ') || '없음' : '—'}</td></tr>
    <tr><td>썸네일 오류</td><td>${st.ok ? `오류 ${num(st.data.thumb.errored)} · 포기 ${num(st.data.thumb.gave_up)}` : '—'}</td></tr>
  </table>
  <h3>Edge 함수 <small>배포 시각 · 24h 호출 · 5xx · 「코드보다 밀린 배포」 판정은 맥의 tool/ops_dashboard.mjs</small></h3>
  <table><tr><th>함수</th><th>상태</th><th class="n">24h 호출</th><th class="n">5xx</th><th class="n">마지막 배포</th></tr>
  ${fns.map((f) => { const e = edgeBy.get(f.slug); return `<tr><td>${esc(f.slug)}</td><td>${esc(f.status)}${f.version != null ? ` v${num(f.version)}` : ''}</td><td class="n">${num(e?.n ?? 0)}</td><td class="n">${num(e?.e5 ?? 0)}</td><td class="n">${when(f.updated)}</td></tr>` }).join('')}
  </table>
  <h3>알림 type(7일)</h3>
  <p>${ps.ok ? ps.data.notif_by_type.map((x) => `${esc(x.type)} ${num(x.n)}`).join(' · ') : '—'}</p>
  </div></details>`
}

/** 칸 하나의 그리기가 터져도 나머지는 그린다 */
function safe(name, fn) {
  try { return fn() } catch (e) { return `<section><h2>${esc(name)}</h2><p class="st warn" style="display:block;padding:8px 12px;border-radius:10px">이 칸을 그리지 못했어요 — 개발자에게 알려 주세요.</p></section>` }
}

// ── 화면 전환 ───────────────────────────────────────────────
const $ = (id) => document.getElementById(id)
function show(which) { for (const id of ['login', 'denied', 'app']) $(id).hidden = id !== which }

let newest = null, lastRead = null, timer = null

function paint() {
  $('app').innerHTML = [
    safe('머리', () => renderHeader(newest)),
    safe('오늘 한눈에', renderToday),
    safe('최근 14일 흐름', renderTrend),
    `<div class="grid">${[
      safe('사용자', renderUsers), safe('새로 온 사람', renderFunnel), safe('주행 · 글', renderActivity), safe('그룹 라이딩', renderGroups),
      safe('크루', renderCrews), safe('신고 · 차단', renderReports), safe('앱 알림', renderPush), safe('서버 상태', renderServer),
      safe('네이버 길찾기', renderDirections), safe('저장 공간', renderCapacity),
    ].join('')}</div>`,
    safe('외부 자료', renderFresh),
    safe('개발자용', () => renderDev(newest)),
  ].join('')
  $('reloadBtn').onclick = () => load(true)
  $('logoutBtn').onclick = logout
  tick()
}

function tick() {
  const a = $('agoText')
  if (a && newest) a.textContent = `${when(newest)} · ${ago(newest)}`
  const r = $('readAt')
  if (r && lastRead) r.textContent = `화면 새로 읽음 ${clock(lastRead)}`
}

async function load(manual) {
  const btn = $('reloadBtn')
  if (manual && btn) btn.disabled = true
  const [{ data, error }, ago24] = await Promise.all([sb.rpc('ops_latest_snapshots'), sb.rpc('ops_snapshots_ago')])
  if (error) {
    if (/JWT|jwt|401/.test(error.message ?? '')) return gate()
    const r = $('readAt')
    if (r) r.textContent = '다시 읽기에 실패했어요 — 잠시 뒤 다시 눌러 주세요'
    if (btn) btn.disabled = false
    return
  }
  if (!data.length) {
    const staff = await sb.rpc('is_ops_staff')
    if (staff.data !== true) { clearInterval(timer); show('denied'); return }
  }
  S = Object.fromEntries(data.map((r) => [r.section, r]))
  A = Object.fromEntries((ago24.data ?? []).map((r) => [r.section, r]))
  newest = data.reduce((m, r) => (r.section !== 'mgmt' && (!m || r.taken_at > m) ? r.taken_at : m), null)
  lastRead = new Date()
  paint()
  show('app')
}

async function gate() {
  clearInterval(timer)
  const { data: { session } } = await sb.auth.getSession()
  if (!session) { $('loginTag').textContent = isProd ? '' : '개발 서버'; show('login'); return }
  const { data, error } = await sb.rpc('is_ops_staff')
  if (error) { await sb.auth.signOut(); show('login'); return }
  if (data !== true) { show('denied'); return }
  await load()
  timer = setInterval(() => { if (!document.hidden) load() }, RELOAD_MS)
}

async function logout() {
  clearInterval(timer)
  await sb.auth.signOut()
  S = {}; A = {}; newest = null
  $('app').innerHTML = ''
  $('loginPw').value = ''
  show('login')
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault()
  const id = $('loginId').value.trim()
  const pw = $('loginPw').value
  const err = $('loginErr')
  err.textContent = ''
  if (!id || !pw) { err.textContent = '아이디와 비밀번호를 넣어 주세요.'; return }
  const email = LOGIN_IDS[id.toLowerCase()] ?? id
  const btn = $('loginBtn')
  btn.disabled = true
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: pw })
    if (error) { err.textContent = '아이디 또는 비밀번호가 맞지 않습니다.'; return }
    $('loginPw').value = ''
    await gate()
  } finally {
    btn.disabled = false
  }
})
$('deniedOut').onclick = logout
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('app').hidden) load() })
setInterval(tick, 15000)
gate()
</script>
</body></html>
